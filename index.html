function renderLedger(calc){if(!currentData.employees.length)return staffSubNav()+'<div class="empty"><span class="eico">👥</span><p>No employees added</p></div>';if(!selectedEmployee)selectedEmployee=currentData.employees[0].name;const emp=currentData.employees.find(e=>e.name===selectedEmployee)||currentData.employees[0];const months=getFYMonths(appConfig.currentFY);const today=getTodayBS();let cumulative=0;const rows=months.map(m=>{const active=isEmployeeActive(emp,m);const unpaidDays=(currentData.unpaidLeaves?.[emp.name]?.[m])||0;const ded=unpaidDays>0?Math.round((emp.salary/30)*unpaidDays):0;const salary=active?emp.salary-ded:0;const bonus=(currentData.bonuses[emp.name]&&currentData.bonuses[emp.name][m])||0;const advance=(calc.employeeAdvances[emp.name]&&calc.employeeAdvances[emp.name][m])||0;const isCurrentMonth=m===today.monthStr;const isFuture=m>today.monthStr;const prorated=active&&isCurrentMonth?Math.round(salary*today.day/today.totalDays):null;const net=salary+bonus-advance;cumulative+=net;return{m,name:getMonthName(m),active,salary,unpaidDays,ded,bonus,advance,net,cumulative,isCurrentMonth,isFuture,prorated};});return staffSubNav()+`<div class="emp-chips">${currentData.employees.map(e=>`<div class="emp-chip ${selectedEmployee===e.name?'active':''} ${e.status!=='active'?'inactive-chip':''}" onclick="selEmp('${e.name}')">${e.name}</div>`).join('')}</div><div class="ib ib-b">💡 <div>Salary for month M is paid in M+1. Start: ${emp.startDate||'—'}${emp.endDate?' · End: '+emp.endDate:''} · Active · ${fmt(emp.salary)}/mo</div></div><div class="card"><div class="card-hd"><h3>👔 ${emp.name}</h3><small>${fmt(emp.salary)}/mo · ${emp.status}</small></div><div class="tbl-wrap"><table><thead><tr><th>Month</th><th class="tr">Salary</th><th class="tr">Unpaid Days</th><th class="tr">Bonus</th><th class="tr">Advance</th><th class="tr">Net</th><th class="tr">Cumul.</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.isCurrentMonth?'tr-today':r.isFuture?'tr-future':''}"><td class="bold">${r.name}${r.isCurrentMonth?'<span class="chip-festival">Now</span>':''}</td><td class="tr">${r.salary>0?fmt(r.salary):'—'}${r.ded>0?`<br><span style="font-size:10px;color:var(--red)">-${fmt(r.ded)}</span>`:''}${r.prorated!==null?`<br><span style="font-size:10px;color:var(--orange)">≈${fmt(r.prorated)}</span>`:''}</td><td class="tr">${r.active?`<input class="ie" type="number" value="${r.unpaidDays||''}" placeholder="0" onchange="setUnpaid('${emp.name}','${r.m}',this.value)" style="width:44px">`:' —'}</td><td class="tr">${r.active?`<input class="ie" type="number" value="${r.bonus||''}" placeholder="0" onchange="setBonus('${emp.name}','${r.m}',this.value)" style="width:64px">`:' —'}</td><td class="tr td">${r.advance>0?fmt(r.advance):'—'}</td><td class="tr ${r.net>=0?'ts':'td'}">${r.active?fmt(r.net):'—'}</td><td class="tr bold ${r.cumulative>=0?'ts':'td'}">${fmt(r.cumulative)}</td></tr>`).join('')}<tr class="tr-total"><td>TOTAL</td><td class="tr">${fmt(rows.reduce((s,r)=>s+r.salary,0))}</td><td></td><td class="tr">${fmt(rows.reduce((s,r)=>s+r.bonus,0))}</td><td class="tr td">${fmt(rows.reduce((s,r)=>s+r.advance,0))}</td><td class="tr ${rows.reduce((s,r)=>s+r.net,0)>=0?'ts':'td'}">${fmt(rows.reduce((s,r)=>s+r.net,0))}</td><td class="tr bold">${fmt(rows[rows.length-1].cumulative)}</td></tr></tbody></table></div></div>`;}
function selEmp(name){selectedEmployee=name;render();}
function setBonus(emp,m,v){if(!currentData.bonuses[emp])currentData.bonuses[emp]={};currentData.bonuses[emp][m]=Number(v)||0;saveData();}
function setUnpaid(emp,m,v){if(!currentData.unpaidLeaves)currentData.unpaidLeaves={};if(!currentData.unpaidLeaves[emp])currentData.unpaidLeaves[emp]={};currentData.unpaidLeaves[emp][m]=Number(v)||0;saveData();}

// ── SETTLEMENT ─────────────────────────────────────────────────────────────────
function renderSettlement(){const calc=calcFY(appConfig.currentFY);const todayInfo=getTodayBS();const settlements=currentData.employees.map(emp=>{const months=getFYMonths(appConfig.currentFY);let earned=0;months.forEach(m=>{if(isEmployeeActive(emp,m)&&m<todayInfo.monthStr)earned+=getEmpEarned(emp,m,currentData.bonuses,currentData.unpaidLeaves||{});else if(m===todayInfo.monthStr&&isEmployeeActive(emp,m))earned+=Math.round(emp.salary/30*todayInfo.day);});const totalAdv=Object.values(calc.employeeAdvances[emp.name]||{}).reduce((s,v)=>s+v,0);return{name:emp.name,status:emp.status,earned,totalAdv,net:earned-totalAdv};});return staffSubNav()+`<div class="ib ib-b">ℹ️ <div>Estimated settlement to date (${todayInfo.day}/${todayInfo.totalDays} days of current month).</div></div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Status</th><th class="tr">Earned</th><th class="tr">Advances</th><th class="tr">Net Payable</th></tr></thead><tbody>${settlements.map(s=>`<tr><td class="bold">${s.name}</td><td><span class="tag ${s.status==='active'?'tg':s.status==='left'?'tw':'tr-tag'}">${s.status}</span></td><td class="tr ts">${fmt(s.earned)}</td><td class="tr td">${fmt(s.totalAdv)}</td><td class="tr ${s.net>=0?'ts':'td'} bold">${fmt(s.net)}</td></tr>`).join('')}<tr class="tr-total"><td>TOTAL</td><td></td><td class="tr ts">${fmt(settlements.reduce((s,r)=>s+r.earned,0))}</td><td class="tr td">${fmt(settlements.reduce((s,r)=>s+r.totalAdv,0))}</td><td class="tr ${settlements.reduce((s,r)=>s+r.net,0)>=0?'ts':'td'}">${fmt(settlements.reduce((s,r)=>s+r.net,0))}</td></tr></tbody></table></div></div>`;}

// ── CALENDAR ───────────────────────────────────────────────────────────────────
function renderCalendar(){const today=getTodayBS();if(!calViewMonth)calViewMonth=today.monthStr;const[y,m]=calViewMonth.split('-').map(Number);const maxD=getMonthDays(y,m),startDow=bsStartWeekday(y,m);const festivalsThisMonth=getFestivalsForMonth(m);const dailySales={},dailyExp={};currentData.sales.filter(s=>s.date.startsWith(calViewMonth)).forEach(s=>{const d=parseInt(s.date.split('-')[2]);dailySales[d]=(dailySales[d]||0)+saleTotal(s);});currentData.expenses.filter(e=>e.date.startsWith(calViewMonth)).forEach(e=>{const d=parseInt(e.date.split('-')[2]);dailyExp[d]=(dailyExp[d]||0)+e.amount;});const festDayMap={};festivalsThisMonth.forEach(f=>{if(f.d)festDayMap[f.d]=(festDayMap[f.d]||[]).concat(f);});const totalSales=Object.values(dailySales).reduce((s,v)=>s+v,0);const totalExp=Object.values(dailyExp).reduce((s,v)=>s+v,0);let cells='';for(let i=0;i<startDow;i++)cells+=`<div class="month-cal-day empty-cal"></div>`;for(let d=1;d<=maxD;d++){const isToday=y===today.year&&m===today.month&&d===today.day;const s=dailySales[d],e=dailyExp[d];const fests=festDayMap[d]||[];const topFest=fests[0];const bgStyle=topFest&&topFest.type==='major'?'style="background:#fff8e0"':'';const dateStr=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<div class="month-cal-day ${isToday?'today-cal':''}" ${bgStyle} onclick="showDayDetail('${dateStr}')"><div class="day-num">${d}${fests.length?`<span style="color:var(--orange);font-size:8px"> ✦</span>`:''}</div>${s?`<div class="day-sale">${fmt(s)}</div>`:''}${e?`<div class="day-exp">-${fmt(e)}</div>`:''}${topFest?`<div class="day-festival">${topFest.name.length>10?topFest.name.slice(0,9)+'…':topFest.name}</div>`:''}</div>`;}return`<div class="card"><div style="background:linear-gradient(135deg,var(--brand),var(--brand3));display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-radius:var(--radius) var(--radius) 0 0"><button class="btn-icon" onclick="shiftCalView(-1)">‹</button><div style="text-align:center"><div style="color:var(--gold);font-family:'Libre Baskerville',serif;font-size:17px;font-weight:700">${NM[m]} ${y}</div><div style="color:#c9a460;font-size:11px">${NM_NP[m]} ${y} BS</div></div><button class="btn-icon" onclick="shiftCalView(1)">›</button></div><div style="display:flex;border-bottom:1px solid var(--border)"><div style="flex:1;padding:10px 14px;border-right:1px solid var(--border)"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted)">Sales</div><div class="ts bold" style="font-size:16px;margin-top:2px">${fmt(totalSales)}</div></div><div style="flex:1;padding:10px 14px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted)">Expenses</div><div class="td bold" style="font-size:16px;margin-top:2px">${fmt(totalExp)}</div></div></div><div class="month-cal">${DOW.map(d=>`<div class="month-cal-hd">${d}</div>`).join('')}${cells}</div></div>${festivalsThisMonth.length?`<div class="card"><div class="card-hd"><h3>🎉 Festivals — ${NM[m]}</h3></div><div class="card-bd"><div style="display:flex;flex-direction:column;gap:7px">${festivalsThisMonth.map(f=>`<div style="display:flex;align-items:center;gap:10px;font-size:12px"><span style="background:var(--gold-pale);padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;color:var(--orange);min-width:28px;text-align:center">D${f.d}</span><div><div class="bold">${f.name}</div><div class="tm" style="font-size:10px">${f.type} · ${f.boost>1?`🚀 Est. boost: ×${f.boost}`:f.boost<1?'⚠️ Lower sales expected':'—'}</div></div></div>`).join('')}</div></div></div>`:''}<div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn btn-s" onclick="goTo('more')" style="flex:1">← More</button><button class="btn btn-gold" onclick="goTo('sales')" style="flex:1">+ Add Sales</button></div>`;}
function shiftCalView(dir){const[y,m]=calViewMonth.split('-').map(Number);let nm=m+dir,ny=y;if(nm>12){nm=1;ny++;}if(nm<1){nm=12;ny--;}calViewMonth=`${ny}-${String(nm).padStart(2,'0')}`;render();}
window.showDayDetail=function(dateStr){const[y,m,d]=dateStr.split('-').map(Number);const daySales=currentData.sales.filter(s=>s.date===dateStr);const dayExp=currentData.expenses.filter(e=>e.date===dateStr);const totalS=daySales.reduce((s,x)=>s+saleTotal(x),0);const totalE=dayExp.reduce((s,e)=>s+e.amount,0);const todayFests=(getFestivalsForMonth(m)||[]).filter(f=>f.d===d);document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModal()"></div><div class="modal-sheet"><div class="modal-handle"></div><h3>📅 ${NM[m]} ${d}, ${y} BS</h3>${todayFests.length?`<div class="ib ib-y">🎉 ${todayFests.map(f=>f.name).join(' · ')}</div>`:''}<div class="kpi-grid" style="margin-bottom:16px"><div class="kpi"><div class="kpi-stripe" style="background:var(--green)"></div><label>Sales</label><div class="kv ts">${totalS>0?fmt(totalS):'—'}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--red)"></div><label>Expenses</label><div class="kv td">${totalE>0?fmt(totalE):'—'}</div></div></div>${daySales.length?daySales.map(s=>`<div class="summary-bar"><span>${appConfig.saleChannels.map(c=>`${c.label}: ${fmt(saleAmt(s,c.key))}`).join(' · ')}</span><span class="ts bold">${fmt(saleTotal(s))}</span></div>`).join(''):`<div class="ib ib-y">No sales for this day.</div>`}${dayExp.length?`<div style="margin-top:8px">${dayExp.map(e=>`<div class="summary-bar"><span><span class="tag tb">${e.category}</span>${e.description?' — '+e.description:''}</span><span class="td bold">${fmt(e.amount)}</span></div>`).join('')}</div>`:''}<div class="modal-actions"><button class="btn btn-s" onclick="closeModal()">Close</button><button class="btn btn-gold" onclick="closeModal();openAddSaleModal()">+ Add Sales</button></div></div>`;}

// ── PROFIT & LOSS ──────────────────────────────────────────────────────────────
function renderProfit(calc,fy){const grossProfit=calc.totalSales-calc.totalExpenses;const netProfit=calc.totalNet;const gm=calc.totalSales>0?(grossProfit/calc.totalSales*100).toFixed(1):0;const nm=calc.totalSales>0?(netProfit/calc.totalSales*100).toFixed(1):0;const catBreakdown={};currentData.expenses.forEach(e=>{catBreakdown[e.category]=(catBreakdown[e.category]||0)+e.amount;});const sortedCats=Object.entries(catBreakdown).sort((a,b)=>b[1]-a[1]);return`<button class="back-btn" onclick="goTo('more')">← More</button><div class="sec-hd">Profit & Loss — ${getFYLabel(fy)}</div><div class="card"><div class="card-hd"><h3>📉 P&L Summary</h3></div><div class="card-bd">${[['Total Revenue',calc.totalSales,'ts'],['Operating Expenses',calc.totalExpenses,'td'],['Salary & Wages',calc.totalSalary,'tw2'],null,['Gross Profit',grossProfit,grossProfit>=0?'ts':'td'],['Net Profit / Loss',netProfit,netProfit>=0?'ts':'td']].map(x=>x===null?`<div class="divider"></div>`:`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px"><span class="bold">${x[0]}</span><span class="${x[2]} bold">${fmt(x[1])}</span></div>`).join('')}<div style="display:flex;gap:10px;margin-top:14px"><div class="kpi" style="flex:1"><div class="kpi-stripe" style="background:var(--blue)"></div><label>Gross Margin</label><div class="kv" style="color:${gm>=20?'var(--green)':'var(--orange)'}">${gm}%</div></div><div class="kpi" style="flex:1"><div class="kpi-stripe" style="background:var(--green)"></div><label>Net Margin</label><div class="kv" style="color:${nm>=10?'var(--green)':nm>=0?'var(--orange)':'var(--red)'}">${nm}%</div></div></div></div></div>${sortedCats.length?`<div class="card"><div class="card-hd"><h3>🏷️ Expense Breakdown</h3></div><div class="card-bd"><div class="bar-chart">${sortedCats.slice(0,10).map(([c,v])=>`<div class="bar-row"><div class="bar-label">${c.slice(0,7)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/sortedCats[0][1]*100)}%;background:linear-gradient(90deg,var(--red),#f87171)"><span class="bar-val">${fmt(v)}</span></div></div></div>`).join('')}</div></div></div>`:''}<div class="card"><div class="card-hd"><h3>📅 Monthly P&L</h3></div><div class="tbl-wrap"><table><thead><tr><th>Month</th><th class="tr">Revenue</th><th class="tr">Costs</th><th class="tr">Profit</th><th class="tr">Margin</th></tr></thead><tbody>${calc.rows.map(r=>{const margin=r.sales>0?((r.net/r.sales)*100).toFixed(1):'—';return`<tr><td class="bold">${r.name}</td><td class="tr ts">${r.sales>0?fmt(r.sales):'—'}</td><td class="tr td">${r.expenses+r.salary>0?fmt(r.expenses+r.salary):'—'}</td><td class="tr ${r.net>0?'ts':r.net<0?'td':'tm'}">${r.sales>0||r.salary>0?fmt(r.net):'—'}</td><td class="tr tm" style="font-size:11px">${margin!=='—'?margin+'%':'—'}</td></tr>`}).join('')}<tr class="tr-total"><td>TOTAL</td><td class="tr ts">${fmt(calc.totalSales)}</td><td class="tr td">${fmt(calc.totalExpenses+calc.totalSalary)}</td><td class="tr ${calc.totalNet>=0?'ts':'td'}">${fmt(calc.totalNet)}</td><td class="tr tm">${nm}%</td></tr></tbody></table></div></div>`;}

// ── TAX ──────────────────────────────────────────────────────────────────────
function renderTax(calc,fy){const vatPct=Math.min(100,Math.round(calc.totalSales/appConfig.vatThreshold*100));const taxable=Math.max(0,calc.totalNet);const{total:taxDue,breakdown}=calcSlabTax(taxable);let cum=0;const slabLabels=breakdown.map(s=>{const from=cum;const to=s.limit>=SLAB_MAX?null:cum+s.limit;if(to!==null)cum=to;return to===null?`Above ${fmt(from)}`:`${fmt(from)} – ${fmt(to)}`;});const empPIT=currentData.employees.filter(e=>e.status==='active').map(e=>{const annual=e.salary*12;return{name:e.name,salary:e.salary,annual,tax:Math.round(calcSlabTax(annual).total)};});return`<button class="back-btn" onclick="goTo('more')">← More</button><div class="sec-hd">Tax Planning — ${getFYLabel(fy)}</div><div class="ib ${taxable>0?'ib-b':'ib-g'}"><span style="font-size:22px">${taxable>0?'💰':'✅'}</span><div style="flex:1"><div style="font-weight:700;margin-bottom:3px">${taxable>0?`Estimated tax on this FY's recorded profit: ${fmt(Math.round(taxDue))}`:`No taxable profit recorded yet for ${getFYLabel(fy)}`}</div><div style="font-size:11px;line-height:1.6">Calculated directly from your recorded sales, expenses and salary — nothing added or assumed. Real deductions you can document (see below) may lower this; review the final number with a CA before filing.</div></div></div><div class="kpi-grid wide"><div class="kpi"><div class="kpi-stripe" style="background:var(--blue)"></div><label>Net Profit (FY)</label><div class="kv ${calc.totalNet>=0?'ts':'td'}">${fmt(calc.totalNet)}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--red)"></div><label>Taxable Income</label><div class="kv td">${fmt(taxable)}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--orange)"></div><label>Estimated Tax</label><div class="kv tw2">${fmt(Math.round(taxDue))}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--green)"></div><label>Effective Rate</label><div class="kv ts">${taxable>0?((taxDue/taxable)*100).toFixed(2)+'%':'—'}</div></div></div><div class="card"><div class="card-hd"><h3>📊 Tax Slabs — Nepal ITA 2058</h3><small>Taxable: ${fmt(taxable)}</small></div><div class="tbl-wrap"><table><thead><tr><th>Slab</th><th class="tr">Income in Slab</th><th class="tr">Rate</th><th class="tr">Tax</th></tr></thead><tbody>${breakdown.map((s,i)=>s.income>0?`<tr><td>${slabLabels[i]}</td><td class="tr">${fmt(s.income)}</td><td class="tr tw2">${Math.round(s.rate*100)}%</td><td class="tr td bold">${fmt(Math.round(s.tax))}</td></tr>`:'').join('')}<tr class="tr-total"><td>Total Tax Due</td><td></td><td></td><td class="tr td">${fmt(Math.round(taxDue))}</td></tr></tbody></table></div><div class="card-bd" style="padding-top:0"><div style="font-size:10px;color:var(--muted)">Slab thresholds and rates are editable in Export → Settings if the Finance Act revises them — confirm current figures with your CA.</div></div></div><div class="card"><div class="card-hd"><h3>💡 Deductions Worth Asking Your CA About</h3></div><div class="card-bd"><div class="ib ib-y" style="margin-bottom:12px">📌 <div>These categories are <b>often deductible under Nepal ITA 2058</b> — but only count if you genuinely incurred them and have receipts. This list doesn't change any number above; log the real amount under Expenses if it applies, and the tax figure will update itself.</div></div><div style="display:flex;flex-direction:column;gap:8px">${[['🏗️','Depreciation on fixed assets','Kitchen equipment, refrigerators, display cases, furniture — with purchase invoices, a CA can compute the allowable rate (Schedule 2, ITA 2058).'],['🔐','SSF contributions','If enrolled in the Social Security Fund, the employer share is deductible — bring your SSF deposit receipts.'],['📋','CA / accounting / audit fees','Professional fees for bookkeeping and filing are a deductible business expense — get an official invoice.'],['🔧','Repair & maintenance','Equipment servicing, plumbing, electrical work — log these under Expenses with real bills as you pay them.'],['📦','Packaging & marketing','Boxes, bags, signage, printed material — keep receipts and record them as they happen.'],['🏥','Staff welfare','Uniforms, first-aid, group insurance for employees — genuine costs, with receipts.'],['🏦','Advance tax already paid','Any instalment already paid in Poush, Chaitra or Ashadh reduces the remaining balance due — bring the receipts.']].map(([ico,name,desc])=>`<div style="display:flex;align-items:flex-start;gap:12px;padding:11px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:12px"><span style="font-size:20px;flex-shrink:0;margin-top:1px">${ico}</span><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12px;margin-bottom:2px">${name}</div><div style="font-size:10px;color:var(--muted);line-height:1.5">${desc}</div></div></div>`).join('')}</div></div></div><div class="card"><div class="card-hd"><h3>💰 VAT Status</h3></div><div class="card-bd"><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px"><span class="tm">Sales vs Threshold</span><span class="bold">${fmt(calc.totalSales)} / ${fmt(appConfig.vatThreshold)}</span></div><div class="prog-wrap"><div class="prog-bar" style="width:${vatPct}%;background:${vatPct>=100?'var(--red)':vatPct>=85?'var(--orange)':'var(--green)'}"></div></div><div style="font-size:11px;color:var(--muted);margin-top:5px">${vatPct}% used · ${vatPct<100?`Remaining: ${fmt(appConfig.vatThreshold-calc.totalSales)}`:'EXCEEDED — register now'}</div>${vatPct>=100?`<div style="margin-top:10px;padding:10px;background:var(--red-lt);border-radius:8px;font-size:12px;color:var(--red)"><b>🚨 Action required:</b> Register for VAT with IRD. Charge 13% on all sales going forward.</div>`:''}<div style="margin-top:10px;font-size:10px;color:var(--muted)">The registration threshold is रू50 lakh for goods-only retail or रू30 lakh for mixed goods+service businesses under the Finance Act (revised yearly) — confirm which classification applies to your registration with a CA.</div></div></div><div class="card"><div class="card-hd"><h3>👔 Employee PIT — TDS Schedule</h3><small>Deduct monthly from salary</small></div><div class="tbl-wrap"><table><thead><tr><th>Employee</th><th class="tr">Monthly Sal.</th><th class="tr">Annual PIT</th><th class="tr">TDS / Month</th></tr></thead><tbody>${empPIT.map(e=>`<tr><td class="bold">${e.name}</td><td class="tr">${fmt(e.salary)}</td><td class="tr td">${fmt(e.tax)}</td><td class="tr tw2">${fmt(Math.round(e.tax/12))}</td></tr>`).join('')}<tr class="tr-total"><td>Total</td><td></td><td class="tr td">${fmt(empPIT.reduce((s,e)=>s+e.tax,0))}</td><td class="tr tw2">${fmt(Math.round(empPIT.reduce((s,e)=>s+e.tax,0)/12))}</td></tr></tbody></table></div></div><div class="card" style="border:2px solid var(--gold-dim)"><div class="card-hd" style="background:linear-gradient(135deg,#3d1800,#5a2800)"><h3>📦 Tax Filing Package</h3><small>Hand this to your CA — built from your own recorded data</small></div><div class="card-bd"><div style="display:flex;flex-direction:column;gap:7px;margin-bottom:14px;font-size:12px">${[['📋','Tax Summary','Taxable income · slab breakdown · net tax due'],['📈','Income Schedule','Monthly sales by outlet for all 12 months'],['📊','Expense Ledger','Every expense entry with date, category, amount'],['👥','Employee TDS','Salary · annual PIT · monthly TDS per employee'],['💼','Advance Records','All advances issued during the FY'],['💰','VAT Status','Sales vs threshold with registration guidance'],['✅','Filing Checklist','Documents needed + IRD deadlines + forms to file']].map(([ico,t,d])=>`<div style="display:flex;align-items:center;gap:10px"><span style="font-size:16px">${ico}</span><div><span style="font-weight:700">${t}</span><span style="color:var(--muted)"> — ${d}</span></div></div>`).join('')}</div><button class="btn btn-gold btn-full" style="font-size:14px;padding:13px;letter-spacing:.3px" onclick="exportTaxPackage(${fy})">📥 Download Complete Filing Package (.xlsx)</button><div style="margin-top:8px;font-size:11px;color:var(--muted);text-align:center">7 sheets · numbers pulled straight from your data · have your CA review before filing</div></div></div>`;}

// ── AUDIT ──────────────────────────────────────────────────────────────────────
function renderAudit(calc,fy){const suggestions=[];const netMargin=calc.totalSales>0?calc.totalNet/calc.totalSales:0;if(netMargin<0.05&&calc.totalSales>0)suggestions.push({type:'alert',icon:'📉',title:'Low Net Margin',detail:`Net margin is ${(netMargin*100).toFixed(1)}%. Target 10–15% for a sustainable mithai shop.`});if(calc.totalExpenses>calc.totalSales*0.6&&calc.totalSales>0)suggestions.push({type:'warn',icon:'⚠️',title:'High Operating Expenses',detail:`Expenses are ${Math.round(calc.totalExpenses/calc.totalSales*100)}% of sales. Review discretionary spending.`});if(calc.totalSalary>calc.totalSales*0.35&&calc.totalSales>0)suggestions.push({type:'warn',icon:'👥',title:'High Salary-to-Sales Ratio',detail:`Salary is ${Math.round(calc.totalSalary/calc.totalSales*100)}% of sales. Industry benchmark is under 30%.`});const monthsWithData=calc.rows.filter(r=>r.sales>0);if(monthsWithData.length>2){const avg=calc.totalSales/monthsWithData.length;const low=monthsWithData.filter(r=>r.sales<avg*0.5);if(low.length)suggestions.push({type:'opt',icon:'📅',title:`Low Sales: ${low.map(r=>r.name).join(', ')}`,detail:'Consider targeted promotions or discounts in these months.'});}if(calc.totalSales>appConfig.vatThreshold*0.85&&calc.totalSales<appConfig.vatThreshold)suggestions.push({type:'warn',icon:'💰',title:'Approaching VAT Threshold',detail:`Sales at ${Math.round(calc.totalSales/appConfig.vatThreshold*100)}% of VAT threshold. Prepare for registration.`});const advHeavy=currentData.employees.filter(e=>{const adv=Object.values(calc.employeeAdvances[e.name]||{}).reduce((s,v)=>s+v,0);return adv>e.salary*3;});if(advHeavy.length)suggestions.push({type:'alert',icon:'💼',title:`High Advances: ${advHeavy.map(e=>e.name).join(', ')}`,detail:'Advances exceed 3× monthly salary. Consider implementing a salary advance policy.'});if(!suggestions.length)suggestions.push({type:'ok',icon:'✅',title:'Books look healthy!',detail:'No major issues found. Keep recording daily and review monthly.'});const hasSales=currentData.sales.length>0;const hasExpenses=currentData.expenses.length>0;const hasEmployees=currentData.employees.length>0;const monthsCovered=calc.rows.filter(r=>r.sales>0).length;const checks=[{ok:hasSales,label:'Sales entries recorded',detail:`${currentData.sales.length} entries`},{ok:hasExpenses,label:'Expenses recorded',detail:`${currentData.expenses.length} entries`},{ok:hasEmployees,label:'Employee details added',detail:`${currentData.employees.length} employees`},{ok:monthsCovered>=6,label:'6+ months of data',detail:`${monthsCovered}/12 months`},{ok:calc.totalExpenses>0&&currentData.expenses.some(e=>e.category==='Rent'),label:'Rent expenses recorded',detail:'Required for deduction'},{ok:currentData.expenses.some(e=>e.category==='Gas'||e.category==='Electicity'),label:'Utility bills recorded',detail:'Gas & electricity'},{ok:currentData.advances.length>0||true,label:'Staff advances tracked',detail:`${currentData.advances.length} records`}];const readyCount=checks.filter(c=>c.ok).length;const readyPct=Math.round(readyCount/checks.length*100);return`<button class="back-btn" onclick="goTo('more')">← More</button><div class="sec-hd">Audit & Health Check — ${getFYLabel(fy)}</div>${suggestions.map(s=>`<div class="ib ${s.type==='alert'?'ib-r':s.type==='warn'?'ib-y':s.type==='opt'?'ib-g':'ib-b'}"><span style="font-size:20px">${s.icon}</span><div style="flex:1"><div style="font-weight:700;margin-bottom:4px">${s.title}</div><div style="font-size:11px;line-height:1.6">${s.detail}</div></div></div>`).join('')}<div class="sec-hd">Key Ratios</div><div class="kpi-grid wide">${[['Net Margin',calc.totalSales>0?(calc.totalNet/calc.totalSales*100).toFixed(1)+'%':'—','green'],['Expense Ratio',calc.totalSales>0?(calc.totalExpenses/calc.totalSales*100).toFixed(1)+'%':'—','red'],['Salary Ratio',calc.totalSales>0?(calc.totalSalary/calc.totalSales*100).toFixed(1)+'%':'—','orange'],['Rev/Employee',currentData.employees.filter(e=>e.status==='active').length>0?fmt(Math.round(calc.totalSales/currentData.employees.filter(e=>e.status==='active').length)):'—','blue']].map(([l,v,c])=>`<div class="kpi"><div class="kpi-stripe" style="background:var(--${c})"></div><label>${l}</label><div class="kv" style="color:var(--${c})">${v}</div></div>`).join('')}</div><div class="sec-hd">Filing Readiness — ${readyPct}% Ready</div><div class="card"><div class="card-bd"><div class="prog-wrap" style="margin-bottom:14px;height:10px"><div class="prog-bar" style="width:${readyPct}%;background:${readyPct>=85?'var(--green)':readyPct>=60?'var(--orange)':'var(--red)'}"></div></div><div style="display:flex;flex-direction:column;gap:8px">${checks.map(c=>`<div style="display:flex;align-items:center;gap:10px;font-size:12px"><span style="font-size:16px;flex-shrink:0">${c.ok?'✅':'⬜'}</span><span style="flex:1;${c.ok?'':'color:var(--muted)'}">${c.label}</span><span style="font-size:10px;color:var(--muted)">${c.detail}</span></div>`).join('')}</div></div></div><div class="sec-hd">Documents to Collect for IRD</div><div class="card"><div class="card-bd"><div style="display:flex;flex-direction:column;gap:8px">${[['🪪','PAN Card / Business Registration Certificate','Original + photocopy required at IRD counter'],['🏦','Bank Statements (all accounts, full FY)','Reconcile with recorded sales & expenses'],['🧾','All Expense Receipts & Invoices','Khwapecha, Thamel, Rent, Gas, Utilities etc.'],['📄','Rent Agreement / Receipts','Proves deductibility of rent expense'],['🏗️','Fixed Asset Invoices','For depreciation claim — purchase bills of equipment'],['🔐','SSF Contribution Receipts','If enrolled in SSF — employer & employee records'],['📋','Previous Year IT Return (if any)','For continuity and carry-forward reference'],['👥','Employee ID / Citizenship Copies','Required for TDS filing with employee PAN'],['💾','This Filing Package (Excel)','Pre-filled income, expenses, TDS, checklist']].map(([ico,title,desc])=>`<div style="display:flex;align-items:flex-start;gap:10px;font-size:12px;padding:8px 0;border-bottom:1px solid #f0e6d0"><span style="font-size:16px;flex-shrink:0">${ico}</span><div><div style="font-weight:600">${title}</div><div style="font-size:10px;color:var(--muted);margin-top:1px">${desc}</div></div></div>`).join('')}</div></div></div><div class="sec-hd">IRD Filing Deadlines</div><div class="ib ib-y" style="margin-bottom:10px">📌 <div>Rates, thresholds and deadlines are set by each year's Finance Act and can change — confirm current figures with your CA or the IRD portal before relying on them for filing.</div></div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>Form / Task</th><th>Deadline</th><th>Penalty if Late</th></tr></thead><tbody>${[['Annual IT Return (IT-BP1)','End of Ashwin (mid-Oct) or 3 months after FY close','रू100/day up to रू5,000 + 15% interest'],['Advance Tax — 1st instalment (40%)','Poush end (≈ mid-Jan)','15% interest on shortfall'],['Advance Tax — 2nd instalment (70% cumulative)','Chaitra end (≈ mid-Apr)','15% interest on shortfall'],['Advance Tax — 3rd instalment (100% cumulative)','Ashadh end (≈ mid-Jul)','15% interest on shortfall'],['Monthly TDS Deposit','Within 25 days of month end','10% penalty + 15% interest'],['VAT Return (if registered)','Within 25 days of month end','रू1,000–5,000 fine'],['SSF Contribution Deposit','Within 15 days of month end','24% annual interest']].map(([f,d,p])=>`<tr><td class="bold" style="font-size:11px">${f}</td><td class="ts" style="font-size:11px">${d}</td><td class="td" style="font-size:10px">${p}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="card-hd"><h3>🔗 IRD Contacts & Portal</h3></div><div class="card-bd"><div style="display:flex;flex-direction:column;gap:8px;font-size:12px">${[['📞','IRD Toll-Free','166 00 14 0000'],['📞','IRD Call Center','01-4419111'],['🌐','IRD Website','www.ird.gov.np'],['💻','Taxpayer Portal','taxpayerportal.ird.gov.np'],['🏢','Large Taxpayer Office','01-4415802 (Lazimpat, Kathmandu)']].map(([ico,l,v])=>`<div style="display:flex;align-items:center;gap:10px"><span>${ico}</span><span style="color:var(--muted);flex:1">${l}</span><span style="font-weight:700;color:var(--blue)">${v}</span></div>`).join('')}</div></div></div><div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><button class="btn btn-p" style="flex:1" onclick="goTo('tax')">💰 Tax Planning</button><button class="btn btn-gold" style="flex:1" onclick="exportTaxPackage(${fy})">📥 Download Filing Package</button></div>`;}

// ── SUMMARY ────────────────────────────────────────────────────────────────────
function renderSummary(calc,fy){return`<button class="back-btn" onclick="goTo('more')">← More</button><div class="sec-hd">Monthly Summary — ${getFYLabel(fy)}</div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>Month</th><th class="tr">Sales</th><th class="tr">Expenses</th><th class="tr">Salary</th><th class="tr">Net</th><th class="tr">Tax Est.</th></tr></thead><tbody>${calc.rows.map(r=>`<tr><td><span class="bold">${r.name}</span><br><span style="font-size:10px;color:var(--muted)">${r.month}</span></td><td class="tr ts">${r.sales>0?fmt(r.sales):'—'}</td><td class="tr td">${r.expenses>0?fmt(r.expenses):'—'}</td><td class="tr tw2">${r.salary>0?fmt(r.salary):'—'}</td><td class="tr ${r.net>0?'ts':r.net<0?'td':'tm'}">${r.sales>0||r.salary>0?fmt(r.net):'—'}</td><td class="tr tm" style="font-size:11px">${r.tax>0?fmt(r.tax):'—'}</td></tr>`).join('')}<tr class="tr-total"><td>FY TOTAL</td><td class="tr ts">${fmt(calc.totalSales)}</td><td class="tr td">${fmt(calc.totalExpenses)}</td><td class="tr tw2">${fmt(calc.totalSalary)}</td><td class="tr ${calc.totalNet>=0?'ts':'td'}">${fmt(calc.totalNet)}</td><td class="tr tm">${fmt(calc.totalTax)}</td></tr></tbody></table></div></div>`;}

// ── SAVINGS ────────────────────────────────────────────────────────────────────
function renderSavings(calc){return`<button class="back-btn" onclick="goTo('more')">← More</button><div class="today-hero" style="padding:16px"><div class="hero-date">💰 Savings Balance</div><div class="hero-amount">${fmt(calc.savingsBalance)}</div></div><div class="card"><div class="card-hd"><h3>+ Add Transaction</h3></div><div class="form-panel"><div class="form-row"><div class="fg"><label>Date (BS)</label><div class="date-row"><input id="sv-date" value="${getTodayBS().str}"><button class="btn btn-s" onclick="showBSPicker('sv-date')">📅</button></div></div><div class="fg"><label>Type</label><select id="sv-type"><option value="in">↑ Deposit</option><option value="out">↓ Withdraw</option></select></div></div><div class="form-row"><div class="fg"><label>Amount (रू)</label><input id="sv-amt" type="number" placeholder="0" min="0"></div><div class="fg"><label>Note</label><input id="sv-note" placeholder="Monthly savings…"></div></div><button class="btn btn-gold btn-full" onclick="addSaving()">Save Transaction</button></div></div><div class="card"><div class="card-hd"><h3>📋 History</h3></div>${(currentData.savings||[]).length===0?`<div class="empty"><span class="eico">🏦</span><p>No transactions yet</p></div>`:`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Type</th><th class="tr">Amount</th><th>Note</th><th></th></tr></thead><tbody>${[...(currentData.savings||[])].map((t,i)=>`<tr><td class="bold">${t.date}</td><td><span class="tag ${t.type==='in'?'tg':'tr-tag'}">${t.type==='in'?'↑ Deposit':'↓ Withdraw'}</span></td><td class="tr ${t.type==='in'?'ts':'td'} bold">${t.type==='in'?'+':'-'}${fmt(t.amount)}</td><td class="tm" style="font-size:11px">${t.note||'—'}</td><td><button class="btn btn-d btn-s" onclick="deleteSaving(${i})">✕</button></td></tr>`).join('')}</tbody></table></div>`}</div>`;}
function addSaving(){const date=document.getElementById('sv-date')?.value.trim();if(!isValidBSDate(date)){alert('Invalid date');return;}const type=document.getElementById('sv-type')?.value,amount=parseFloat(document.getElementById('sv-amt')?.value),note=document.getElementById('sv-note')?.value.trim()||'';if(!amount||amount<=0){alert('Enter valid amount');return;}if(!currentData.savings)currentData.savings=[];currentData.savings.push({date,type,amount,note});saveData();showToast(`✓ ${type==='in'?'Deposit':'Withdrawal'} recorded`);render();}
function deleteSaving(i){if(!confirm('Delete?'))return;currentData.savings.splice(i,1);saveData();render();}

// ── FORECAST ───────────────────────────────────────────────────────────────────
function renderForecast(calc,fy){const gr=appConfig.growthRates;const prevData=loadFYData(fy-1);const prevCalc=prevData?calcFY(fy-1,prevData):null;const monthsWithData=calc.rows.filter(r=>r.sales>0).length;let baseSales,baseExp;if(prevCalc&&prevCalc.totalSales>0){baseSales=prevCalc.totalSales;baseExp=prevCalc.totalExpenses;}else if(calc.totalSales>0&&monthsWithData>0){baseSales=calc.totalSales/monthsWithData*12;baseExp=calc.totalExpenses/monthsWithData*12;}else{baseSales=5000000;baseExp=1500000;}const projSales=baseSales*(1+gr.sales/100),projExp=baseExp*(1+gr.expenses/100);const projSalary=currentData.employees.filter(e=>e.status==='active').reduce((s,e)=>s+e.salary,0)*12;const projNet=projSales-projExp-projSalary;const months=getFYMonths(fy);return`<button class="back-btn" onclick="goTo('more')">← More</button><div class="sec-hd">Forecast — Next FY ${getFYLabel(fy+1)}</div><div class="card"><div class="card-hd"><h3>⚙️ Growth Settings</h3></div><div class="form-panel"><div class="form-row"><div class="fg"><label>Sales Growth %</label><input id="gr-s" type="number" value="${gr.sales}" onchange="appConfig.growthRates.sales=parseFloat(this.value)||0;saveAppConfig();render()"></div><div class="fg"><label>Expense Growth %</label><input id="gr-e" type="number" value="${gr.expenses}" onchange="appConfig.growthRates.expenses=parseFloat(this.value)||0;saveAppConfig();render()"></div></div></div></div><div class="kpi-grid"><div class="kpi"><div class="kpi-stripe" style="background:var(--blue)"></div><label>Proj. Sales</label><div class="kv ts">${fmt(projSales)}</div><div class="ks">+${gr.sales}%</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--red)"></div><label>Proj. Expenses</label><div class="kv td">${fmt(projExp)}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--orange)"></div><label>Salary</label><div class="kv tw2">${fmt(projSalary)}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--green)"></div><label>Proj. Net</label><div class="kv ${projNet>=0?'ts':'td'}">${fmt(projNet)}</div></div></div><div class="card"><div class="card-hd"><h3>🗓️ Monthly Forecast with Festival Boosts</h3></div><div class="tbl-wrap"><table><thead><tr><th>Month</th><th class="tr">Proj. Sales</th><th>Festivals</th><th class="tr">Boost</th></tr></thead><tbody>${months.map(m=>{const mo=parseInt(m.split('-')[1]);const boost=getMonthBoost(mo);const fests=(getFestivalsForMonth(mo)||[]).filter(f=>f.type==='major').slice(0,2).map(f=>f.name).join(', ');const mSales=(projSales/12)*boost;return`<tr><td class="bold">${getMonthName(m)}</td><td class="tr ts">${fmt(mSales)}</td><td class="tm" style="font-size:11px">${fests||'—'}</td><td class="tr"><span class="tag ${boost>=2?'tr-tag':boost>=1.3?'tw':'tg'}">×${boost}</span></td></tr>`;}).join('')}</tbody></table></div></div>`;}

// ── HISTORY ────────────────────────────────────────────────────────────────────
function renderHistory(fy){return`<button class="back-btn" onclick="goTo('more')">← More</button><div class="sec-hd">Financial Year History</div>${(appConfig.fyList||[fy]).map(f=>{const d=loadFYData(f);if(!d)return'';const c=calcFY(f,d);return`<div class="card"><div class="card-hd"><h3>${getFYLabel(f)}</h3><small>${c.rows.filter(r=>r.sales>0).length} months with data</small></div><div class="kpi-grid" style="padding:12px 14px;margin-bottom:0"><div class="kpi"><div class="kpi-stripe" style="background:var(--blue)"></div><label>Sales</label><div class="kv ts">${fmt(c.totalSales)}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--green)"></div><label>Net Profit</label><div class="kv ${c.totalNet>=0?'ts':'td'}">${fmt(c.totalNet)}</div></div></div></div>`;}).join('')}<div class="card"><div class="card-hd"><h3>➕ Add New FY</h3></div><div class="form-panel"><div class="fg"><label>New FY Year (BS)</label><input id="new-fy" type="number" placeholder="e.g. 2083" min="2075" max="2099"></div><button class="btn btn-gold btn-full" onclick="addNewFY()">Add FY</button></div></div>`;}
function addNewFY(){const fy=parseInt(document.getElementById('new-fy')?.value);if(!fy||fy<2075||fy>2099){alert('Enter valid FY (2075–2099)');return;}if(appConfig.fyList.includes(fy)){alert('FY already exists');return;}appConfig.fyList.push(fy);appConfig.fyList.sort((a,b)=>b-a);saveAppConfig();buildFYSelector();showToast(`✓ ${getFYLabel(fy)} added`);render();}

// ── EXPORT & SETTINGS ──────────────────────────────────────────────────────────
function renderExport(fy){return`<button class="back-btn" onclick="goTo('more')">← More</button><div class="sec-hd">Export & Settings</div><div class="card"><div class="card-hd"><h3>📤 Export Data</h3></div><div class="card-bd" style="display:flex;flex-direction:column;gap:10px"><button class="btn btn-g btn-full" onclick="exportXLSX(${fy})">📊 Export to Excel (.xlsx)</button><button class="btn btn-b btn-full" onclick="exportJSON(${fy})">📁 Export FY Data (JSON)</button><button class="btn btn-b btn-full" onclick="exportAllJSON()">🗂️ Export All FY Data (JSON)</button><button class="btn btn-w btn-full" onclick="importJSON()">📥 Import JSON</button><input type="file" id="import-file" accept=".json" style="display:none" onchange="loadImportFile(this)"></div></div><div class="card"><div class="card-hd"><h3>⚙️ Settings</h3></div><div class="form-panel"><div class="fg"><label>VAT Threshold (रू)</label><input type="number" value="${appConfig.vatThreshold}" onchange="appConfig.vatThreshold=parseFloat(this.value)||3000000;saveAppConfig()"></div><div style="font-size:10px;color:var(--muted)">रू50 lakh for goods-only retail, रू30 lakh for mixed goods+service businesses — confirm which applies with a CA; thresholds are revised by each year's Finance Act.</div><div style="font-size:11px;color:var(--muted);margin-top:4px">Tax Slabs (Nepal):</div>${appConfig.taxSlabs.map((s,i)=>`<div class="form-row"><div class="fg"><label>Limit</label><input type="number" class="ie" value="${s.limit>=SLAB_MAX?'':s.limit}" placeholder="No limit (top bracket)" onchange="updateTaxSlab(${i},'limit',this.value)" style="width:100%"></div><div class="fg"><label>Rate %</label><input type="number" class="ie" value="${Math.round(s.rate*100)}" onchange="updateTaxSlab(${i},'rate',this.value)" style="width:100%"></div></div>`).join('')}</div></div><div class="card"><div class="card-hd" style="background:linear-gradient(135deg,#7f1d1d,#991b1b)"><h3>🗑️ Danger Zone</h3></div><div class="card-bd" style="display:flex;flex-direction:column;gap:10px"><button class="btn btn-d btn-full" onclick="clearFY(${fy})">⚠️ Clear FY ${getFYLabel(fy)} Data</button><p style="font-size:11px;color:var(--muted)">Deletes all sales, expenses, advances & savings for selected FY. Cannot be undone.</p></div></div>`;}
function updateTaxSlab(i,field,val){if(field==='limit')appConfig.taxSlabs[i].limit=val===''?SLAB_MAX:parseFloat(val)||0;else if(field==='rate')appConfig.taxSlabs[i].rate=(parseFloat(val)||0)/100;saveAppConfig();}

function exportJSON(fy){const blob=new Blob([JSON.stringify({fy,config:appConfig,data:currentData},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`BhaktaMithai_FY${fy}.json`;a.click();showToast('✓ JSON exported');}
function exportAllJSON(){const all={config:appConfig,fyData:{}};(appConfig.fyList||[]).forEach(fy=>{const d=loadFYData(fy);if(d)all.fyData[fy]=d;});const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`BhaktaMithai_All.json`;a.click();showToast('✓ All exported');}

window.loadImportFile=function(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.data&&d.fy){saveFYData(d.fy,d.data);if(d.config)Object.assign(appConfig,d.config);if(!appConfig.fyList.includes(d.fy)){appConfig.fyList.push(d.fy);appConfig.fyList.sort((a,b)=>b-a);}appConfig.currentFY=d.fy;saveAppConfig();loadCurrentData();buildFYSelector();showToast('✓ Imported');render();}else if(d.fyData){Object.entries(d.fyData).forEach(([fy,data])=>saveFYData(parseInt(fy),data));if(d.config)Object.assign(appConfig,d.config);const importedYears=Object.keys(d.fyData).map(Number);importedYears.forEach(fy=>{if(!appConfig.fyList.includes(fy))appConfig.fyList.push(fy);});appConfig.fyList.sort((a,b)=>b-a);if(importedYears.length&&!importedYears.includes(appConfig.currentFY))appConfig.currentFY=Math.max(...importedYears);saveAppConfig();loadCurrentData();buildFYSelector();showToast('✓ All imported');render();}else alert('Unknown format');}catch(err){alert('Invalid JSON: '+err.message);}};reader.readAsText(file);}
function clearFY(fy){if(!confirm(`⚠️ Delete ALL data for ${getFYLabel(fy)}?`))return;if(!confirm('Are you absolutely sure?'))return;localStorage.removeItem(FY_KEY(fy));loadCurrentData();showToast('✓ Cleared');render();}

// ── INVENTORY ──────────────────────────────────────────────────────────────────
function renderInventory(){const items=currentData.inventory||[];const adjustments=currentData.inventoryAdjustments||[];const totalItems=items.length;const lowStock=items.filter(i=>i.stock<=i.reorderLevel).length;return`<button class="back-btn" onclick="goTo('more')">← More</button><div class="sec-hd">📦 Inventory Management</div><div class="kpi-grid"><div class="kpi"><div class="kpi-stripe" style="background:var(--blue)"></div><label>Total Items</label><div class="kv ts">${totalItems}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--orange)"></div><label>Low Stock (≤ Reorder)</label><div class="kv tw2">${lowStock}</div></div></div><div class="card"><div class="card-hd"><h3>➕ Add Inventory Item</h3></div><div class="form-panel"><div class="form-row"><div class="fg"><label>Item Name</label><input id="in-name" placeholder="e.g. Sugar"></div><div class="fg"><label>Unit</label><input id="in-unit" placeholder="kg, litre, pcs" value="kg"></div></div><div class="form-row"><div class="fg"><label>Current Stock</label><input id="in-stock" type="number" value="0" min="0"></div><div class="fg"><label>Reorder Level</label><input id="in-reorder" type="number" value="5" min="0"></div></div><button class="btn btn-gold btn-full" onclick="addInventoryItem()">+ Add Item</button></div></div><div class="card"><div class="card-hd"><h3>📋 Inventory List</h3><small>${totalItems} items</small></div>${items.length===0?`<div class="empty"><span class="eico">📦</span><p>No items added yet. Add your first inventory item.</p></div>`:`<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Unit</th><th class="tr">Stock</th><th class="tr">Reorder</th><th>Status</th><th></th></tr></thead><tbody>${items.map((item,i)=>`<tr><td class="bold">${item.name}</td><td>${item.unit||'kg'}</td><td class="tr">${item.stock}</td><td class="tr">${item.reorderLevel}</td><td><span class="tag ${item.stock<=item.reorderLevel?'tr-tag':'tg'}">${item.stock<=item.reorderLevel?'⚠️ Reorder':'OK'}</span></td><td><div style="display:flex;gap:3px"><button class="btn btn-s" onclick="openInventoryAdjust(${i})">📥</button><button class="btn btn-s" onclick="editInventoryItem(${i})">✏️</button><button class="btn btn-d btn-s" onclick="deleteInventoryItem(${i})">✕</button></div></td></tr>`).join('')}</tbody></table></div>`}</div><div class="card"><div class="card-hd"><h3>📊 Stock Adjustments</h3></div>${adjustments.length===0?`<div class="empty"><span class="eico">📊</span><p>No adjustments yet. Use the 📥 button on an item to record stock changes.</p></div>`:`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Item</th><th class="tr">Quantity</th><th>Type</th><th>Note</th><th></th></tr></thead><tbody>${adjustments.map((adj,i)=>{const item=items.find(it=>it.name===adj.itemName);if(!item)return'';return`<tr><td class="bold">${adj.date}</td><td>${adj.itemName}</td><td class="tr ${adj.type==='in'?'ts':'td'}">${adj.type==='in'?'+':'-'}${adj.quantity}</td><td><span class="tag ${adj.type==='in'?'tg':'tr-tag'}">${adj.type==='in'?'Purchase':'Usage'}</span></td><td class="tm" style="font-size:11px">${adj.note||'—'}</td><td><button class="btn btn-d btn-s" onclick="deleteInventoryAdjust(${i})">✕</button></td></tr>`;}).join('')}</tbody></table></div>`}</div>`;}
function addInventoryItem(){const name=document.getElementById('in-name')?.value.trim();if(!name){alert('Enter item name');return;}if((currentData.inventory||[]).find(i=>i.name===name)){alert('Item already exists');return;}const unit=document.getElementById('in-unit')?.value.trim()||'kg';const stock=parseFloat(document.getElementById('in-stock')?.value)||0;const reorder=parseFloat(document.getElementById('in-reorder')?.value)||5;if(!currentData.inventory)currentData.inventory=[];currentData.inventory.push({name,unit,stock,reorderLevel:reorder});saveData();showToast('✓ Item added');render();}
function editInventoryItem(i){const item=currentData.inventory[i];document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModal()"></div><div class="modal-sheet"><div class="modal-handle"></div><h3>✏️ Edit ${item.name}</h3><div class="form-panel"><div class="fg"><label>Item Name</label><input id="ei-name" value="${item.name}"></div><div class="fg"><label>Unit</label><input id="ei-unit" value="${item.unit||'kg'}"></div><div class="fg"><label>Current Stock</label><input id="ei-stock" type="number" value="${item.stock}" min="0"></div><div class="fg"><label>Reorder Level</label><input id="ei-reorder" type="number" value="${item.reorderLevel}" min="0"></div></div><div class="modal-actions"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="saveInventoryEdit(${i})">Save</button></div></div>`;}
function saveInventoryEdit(i){const name=document.getElementById('ei-name')?.value.trim();if(!name){alert('Name required');return;}const unit=document.getElementById('ei-unit')?.value.trim()||'kg';const stock=parseFloat(document.getElementById('ei-stock')?.value)||0;const reorder=parseFloat(document.getElementById('ei-reorder')?.value)||5;currentData.inventory[i]={name,unit,stock,reorderLevel:reorder};saveData();showToast('✓ Updated');closeModal();render();}
function deleteInventoryItem(i){if(!confirm('Delete this item? All adjustments will be removed.'))return;const name=currentData.inventory[i].name;currentData.inventory.splice(i,1);currentData.inventoryAdjustments=currentData.inventoryAdjustments.filter(a=>a.itemName!==name);saveData();render();}
function openInventoryAdjust(i){const item=currentData.inventory[i];const today=getTodayBS();document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModal()"></div><div class="modal-sheet"><div class="modal-handle"></div><h3>📥 Stock Adjustment — ${item.name}</h3><div class="form-panel"><div class="fg"><label>Date (BS)</label><div class="date-row"><input id="ia-date" value="${today.str}"><button class="btn btn-s" onclick="showBSPicker('ia-date')">📅</button></div></div><div class="form-row"><div class="fg"><label>Type</label><select id="ia-type"><option value="in">📥 Purchase (add)</option><option value="out">📤 Usage (subtract)</option></select></div><div class="fg"><label>Quantity</label><input id="ia-qty" type="number" placeholder="0" min="0"></div></div><div class="fg"><label>Note (optional)</label><input id="ia-note" placeholder="e.g. Bought from vendor"></div><input type="hidden" id="ia-idx" value="${i}"></div><div class="modal-actions"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="saveInventoryAdjust()">Save</button></div></div>`;}
function saveInventoryAdjust(){const idx=parseInt(document.getElementById('ia-idx').value);const date=document.getElementById('ia-date')?.value.trim();if(!isValidBSDate(date)){alert('Invalid date');return;}const type=document.getElementById('ia-type')?.value;const qty=parseFloat(document.getElementById('ia-qty')?.value);if(!qty||qty<=0){alert('Enter valid quantity');return;}const note=document.getElementById('ia-note')?.value.trim()||'';const item=currentData.inventory[idx];if(!item){alert('Item not found');return;}if(!currentData.inventoryAdjustments)currentData.inventoryAdjustments=[];if(type==='out'&&item.stock<qty){alert(`Insufficient stock: available ${item.stock}`);return;}currentData.inventoryAdjustments.push({date,itemName:item.name,type,quantity:qty,note});item.stock=type==='in'?item.stock+qty:item.stock-qty;saveData();showToast('✓ Adjustment saved');closeModal();render();}
function deleteInventoryAdjust(i){if(!confirm('Delete this adjustment?'))return;const adj=currentData.inventoryAdjustments[i];if(adj){const item=currentData.inventory.find(it=>it.name===adj.itemName);if(item){item.stock=adj.type==='in'?item.stock-adj.quantity:item.stock+adj.quantity;}}currentData.inventoryAdjustments.splice(i,1);saveData();render();}

// ── GOOGLE DRIVE SYNC MODULE ─────────────────────────────────────────────────────
// Replace with your own Client ID from Google Cloud Console
const DRIVE_CLIENT_ID = '395817358171-7db2p5nl77du10hqtqbfkhk3g0qi66b2.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const SYNC_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes

let driveToken = null;
let driveFolderId = null;
let syncTimeout = null;
let isSyncing = false;

// Load stored tokens / folder ID from localStorage
function loadDriveState() {
  driveToken = localStorage.getItem('drive_token') || null;
  driveFolderId = localStorage.getItem('drive_folder_id') || null;
}
loadDriveState();

// ── OAuth 2.0 (Implicit Flow using Google Identity Services) ──
function connectToDrive() {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.accounts) {
      reject('Google Identity Services not loaded. Check internet connection.');
      return;
    }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: (response) => {
        if (response.error) {
          reject(response.error);
          return;
        }
        driveToken = response.access_token;
        localStorage.setItem('drive_token', driveToken);
        resolve(driveToken);
      },
    });
    client.requestAccessToken();
  });
}

function disconnectDrive() {
  if (confirm('Disconnect Google Drive? Your local data stays safe.')) {
    driveToken = null;
    driveFolderId = null;
    localStorage.removeItem('drive_token');
    localStorage.removeItem('drive_folder_id');
    showToast('🔌 Disconnected from Drive');
    render();
  }
}

// ── Ensure we have a valid token ──
async function ensureDriveToken() {
  if (driveToken) return driveToken;
  // If no token, prompt user to connect
  if (!confirm('Connect to Google Drive for cloud backup?')) throw new Error('User cancelled');
  await connectToDrive();
  return driveToken;
}

// ── Find or create the app's folder ──
async function ensureDriveFolder(token) {
  if (driveFolderId) return driveFolderId;

  const query = "name='BhaktaMithai' and mimeType='application/vnd.google-apps.folder' and trashed=false";
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&spaces=drive`,
    { headers: { Authorization: `Bearer ${token}` } }
  );
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    driveFolderId = data.files[0].id;
    localStorage.setItem('drive_folder_id', driveFolderId);
    return driveFolderId;
  }

  // Create the folder
  const folder = { name: 'BhaktaMithai', mimeType: 'application/vnd.google-apps.folder' };
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: {
      Authorization: `Bearer ${token}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(folder),
  });
  const newFolder = await createRes.json();
  driveFolderId = newFolder.id;
  localStorage.setItem('drive_folder_id', driveFolderId);
  return driveFolderId;
}

// ── Search for the FY file ──
async function findFYFile(token, fy, folderId) {
  const fileName = `FY_${fy}.json`;
  const query = `name='${fileName}' and '${folderId}' in parents and trashed=false`;
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,modifiedTime)&spaces=drive`,
    { headers: { Authorization: `Bearer ${token}` } }
  );
  const data = await res.json();
  return data.files && data.files.length > 0 ? data.files[0] : null;
}

// ── Upload data to Drive ──
async function uploadToDrive(fy, data, token) {
  const folderId = await ensureDriveFolder(token);
  const file = await findFYFile(token, fy, folderId);
  const fileName = `FY_${fy}.json`;

  const metadata = {
    name: fileName,
    parents: [folderId],
  };
  const form = new FormData();
  form.append(
    'metadata',
    new Blob([JSON.stringify(metadata)], { type: 'application/json' })
  );
  form.append(
    'file',
    new Blob([JSON.stringify(data)], { type: 'application/json' })
  );

  const url = file
    ? `https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const method = file ? 'PATCH' : 'POST';

  const res = await fetch(url, {
    method,
    headers: { Authorization: `Bearer ${token}` },
    body: form,
  });
  if (!res.ok) throw new Error(await res.text());
  return await res.json();
}

// ── Download data from Drive ──
async function downloadFromDrive(fy, token) {
  const folderId = await ensureDriveFolder(token);
  const file = await findFYFile(token, fy, folderId);
  if (!file) return null;

  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,
    { headers: { Authorization: `Bearer ${token}` } }
  );
  if (!res.ok) throw new Error(await res.text());
  const data = await res.json();
  return { data, modifiedTime: file.modifiedTime };
}

// ── Main SYNC function ──
async function syncWithDrive() {
  if (isSyncing) return;
  isSyncing = true;
  try {
    const token = await ensureDriveToken();
    const fy = appConfig.currentFY;
    const localData = currentData;

    // Get cloud version
    let cloud = null;
    try {
      cloud = await downloadFromDrive(fy, token);
    } catch (e) {
      // file may not exist yet
    }

    const localSyncTime = parseInt(localStorage.getItem('last_sync_time') || '0', 10);
    const now = Date.now();

    if (cloud) {
      const cloudTime = new Date(cloud.modifiedTime).getTime();

      // If cloud is newer than local last sync, load it
      if (cloudTime > localSyncTime) {
        // Confirm with user
        const choice = confirm(
          `Cloud data is newer (${new Date(cloudTime).toLocaleString()}).\nLoad it? (Yes = load cloud, No = overwrite cloud with your local data)`
        );
        if (choice) {
          // Load cloud
          currentData = cloud.data;
          localStorage.setItem('last_sync_time', cloudTime);
          saveFYData(fy, currentData); // save locally
          loadCurrentData(); // re-initialise
          render();
          showToast('☁️ Synced from cloud');
          return;
        } else {
          // Overwrite cloud with local
          await uploadToDrive(fy, localData, token);
          localStorage.setItem('last_sync_time', now);
          showToast('☁️ Pushed local data to cloud');
          return;
        }
      }
    }

    // No conflict – check if local has changes since last sync
    if (localSyncTime < now - 5000) {
      // Upload local to cloud
      await uploadToDrive(fy, localData, token);
      localStorage.setItem('last_sync_time', now);
      // No toast to avoid spam, only on explicit saves
    }
  } catch (err) {
    console.warn('Sync failed:', err);
    // Silent fail – data is still saved locally
  } finally {
    isSyncing = false;
  }
}

// ── Wrapper to call sync on save ──
function triggerSync() {
  if (!driveToken) return; // user not connected yet
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => {
    syncWithDrive().catch(console.warn);
  }, 2000); // debounce 2s
}

// ── Periodic background sync ──
function startBackgroundSync() {
  setInterval(() => {
    if (driveToken) {
      syncWithDrive().catch(console.warn);
    }
  }, SYNC_INTERVAL_MS);
}

// ── Connect button – call this from a UI button ──
async function connectDrive() {
  try {
    await connectToDrive();
    await syncWithDrive();
    showToast('✅ Connected to Drive');
    render();
  } catch (e) {
    alert('Failed to connect: ' + e);
  }
}

// ── Override saveData to trigger sync ──
const originalSaveData = saveData;
saveData = function() {
  try {
    originalSaveData();
    if (driveToken) {
      triggerSync();
    }
  } catch (e) {
    // fallback
  }
};
