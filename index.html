<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#1a0800">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🪔 Bhakta Mithai</title>
<!-- Load Google Identity Services for OAuth -->
<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* (same styles as before – omitted for brevity, but included in full file below) */
:root{
  --bg:#f5efe4;--surface:#fffdf8;--surface2:#fdf7ec;
  --brand:#1a0800;--brand2:#2e1200;--brand3:#4a1e04;
  --gold:#e8a420;--gold-lt:#fce8a0;--gold-dim:#c98a1a;--gold-pale:#fdf3d0;
  --cream:#fdf6e4;--border:#e8d5a8;--border2:#d4bb88;
  --text:#1a0800;--muted:#7a5830;--muted2:#b08050;
  --green:#0f7a3c;--green-lt:#d4f0e0;
  --red:#c41818;--red-lt:#fde8e8;
  --orange:#c86a00;--orange-lt:#feecc8;
  --blue:#1a5cbf;--blue-lt:#dceeff;
  --nav-h:64px;--header-h:56px;--radius:16px;
  --shadow:0 2px 16px rgba(26,8,0,.08);
  --shadow-md:0 4px 24px rgba(26,8,0,.14);
  --shadow-lg:0 8px 40px rgba(26,8,0,.22);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#app-header{height:var(--header-h);background:linear-gradient(160deg,var(--brand) 0%,var(--brand3) 100%);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.4);position:relative}
#app-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
#hdr-title{flex:1;font-family:'Libre Baskerville',serif;font-size:17px;color:var(--gold);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(232,164,32,.4)}
#hdr-title span{font-style:italic;font-size:12px;color:#c9a460;margin-left:4px}
.hdr-badge{font-size:10px;color:#6ee7b7;background:rgba(255,255,255,.08);padding:4px 9px;border-radius:10px;border:1px solid rgba(110,231,183,.2);white-space:nowrap;font-weight:600;transition:all .3s}
.hdr-badge.saving{color:#fbbf24;border-color:rgba(251,191,36,.3)}
#fy-selector{background:rgba(255,255,255,.08);color:var(--gold);border:1px solid rgba(255,255,255,.15);padding:5px 8px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
#main-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 20px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;background:var(--bg)}
#bottom-nav{height:var(--nav-h);background:linear-gradient(0deg,var(--brand) 0%,var(--brand2) 100%);display:flex;align-items:stretch;flex-shrink:0;border-top:1px solid var(--brand3);box-shadow:0 -4px 20px rgba(0,0,0,.35);z-index:100}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:rgba(122,88,48,.9);transition:all .2s;border:none;background:none;padding:4px 0;position:relative}
.bnav-item::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--gold);border-radius:0 0 2px 2px;opacity:0;transform:scaleX(0);transition:all .2s}
.bnav-item.active{color:var(--gold)}
.bnav-item.active::after{opacity:1;transform:scaleX(1)}
.bnav-item .bi{font-size:22px;line-height:1;transition:transform .2s}
.bnav-item.active .bi{transform:scale(1.1)}
.bnav-item .bl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.card-hd{background:linear-gradient(135deg,var(--brand),var(--brand3));color:#f0d8a8;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.card-hd h3{font-size:13px;font-weight:700;font-family:'Libre Baskerville',serif;letter-spacing:.2px}
.card-hd small{font-size:11px;color:#c9a460;font-weight:500}
.card-bd{padding:14px 16px}
.today-hero{background:linear-gradient(135deg,var(--brand) 0%,#3d1800 50%,var(--brand3) 100%);border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid var(--brand3);box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.today-hero::before{content:'🪔';position:absolute;right:-10px;top:-10px;font-size:80px;opacity:.06;transform:rotate(15deg)}
.hero-date{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#c9a460;margin-bottom:6px}
.hero-amount{font-size:34px;font-family:'Libre Baskerville',serif;color:var(--gold);font-weight:700;line-height:1;text-shadow:0 2px 12px rgba(232,164,32,.4)}
.hero-sub{font-size:11px;color:#9a7040;margin-top:5px;line-height:1.5}
.hero-add-btn{margin-top:12px;padding:10px 18px;background:var(--gold);color:var(--brand);border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 3px 12px rgba(232,164,32,.4);transition:all .2s}
.hero-add-btn:active{transform:scale(.97)}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi-grid.wide{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.kpi{background:var(--surface);border-radius:14px;padding:14px 13px;border:1px solid var(--border);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi-stripe{position:absolute;top:0;left:0;right:0;height:3px;border-radius:2px 2px 0 0}
.kpi label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--muted2);display:block;margin-bottom:5px}
.kpi .kv{font-size:19px;font-weight:700;font-family:'Libre Baskerville',serif;line-height:1.1}
.kpi .ks{font-size:10px;color:var(--muted2);margin-top:4px;line-height:1.3}
.sec-hd{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:16px 0 8px 2px;display:flex;align-items:center;gap:8px}
.sec-hd::after{content:'';flex:1;height:1px;background:var(--border)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:360px}
thead{background:var(--surface2)}
th{padding:9px 11px;text-align:left;font-size:10px;font-weight:700;color:#5a3020;text-transform:uppercase;border-bottom:2px solid var(--border);white-space:nowrap;letter-spacing:.4px}
td{padding:10px 11px;border-bottom:1px solid #f0e6d0;vertical-align:middle}
tr:hover td{background:#fdf9f2}
.tr-today td{background:#fffbe8 !important}
.tr-future{opacity:.45}
.tr-total td{background:var(--cream);font-weight:700;border-top:2px solid var(--border)}
.form-panel{padding:14px 16px;background:var(--surface2);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.form-row{display:flex;gap:10px;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:110px}
.fg label{font-size:10px;font-weight:700;color:#7a4820;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;background:var(--surface);width:100%;font-family:'DM Sans',sans-serif;color:var(--text);transition:all .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold-dim);outline:none;box-shadow:0 0 0 3px rgba(201,138,26,.15)}
.fg textarea{resize:vertical;min-height:60px}
.date-row{display:flex;align-items:center;gap:6px}
.date-row input{flex:1}
.btn{padding:10px 16px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,var(--brand),var(--brand3));color:var(--gold);box-shadow:0 2px 10px rgba(26,8,0,.3)}
.btn-d{background:var(--red-lt);color:var(--red);border:1px solid #fca5a5}
.btn-w{background:var(--orange-lt);color:var(--orange);border:1px solid #fdba74}
.btn-g{background:var(--green-lt);color:var(--green);border:1px solid #86efac}
.btn-b{background:var(--blue-lt);color:var(--blue);border:1px solid #93c5fd}
.btn-s{padding:7px 11px;font-size:11px;background:var(--surface);border:1.5px solid var(--border);color:var(--muted);border-radius:8px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--brand);font-weight:700;box-shadow:0 2px 10px rgba(232,164,32,.35)}
.btn-full{width:100%}
.btn-icon{padding:7px 10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--gold);border-radius:8px;cursor:pointer;font-size:14px;line-height:1;transition:.15s}
.btn-icon:active{background:rgba(255,255,255,.2)}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px}
.tg{background:var(--green-lt);color:var(--green)}
.tr-tag{background:var(--red-lt);color:var(--red)}
.tw{background:var(--orange-lt);color:var(--orange)}
.tb{background:var(--blue-lt);color:var(--blue)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.dot-g{background:var(--green)}.dot-r{background:var(--red)}.dot-o{background:var(--orange)}
.ib{border-radius:12px;padding:11px 14px;font-size:12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.ib-b{background:var(--blue-lt);border:1px solid #bfdbfe;color:#1e3a8a}
.ib-g{background:var(--green-lt);border:1px solid #86efac;color:#14532d}
.ib-y{background:var(--gold-pale);border:1px solid #fde68a;color:#78350f}
.ib-r{background:var(--red-lt);border:1px solid #fca5a5;color:#7f1d1d}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--brand);color:var(--gold);padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;display:none;box-shadow:var(--shadow-lg);white-space:nowrap;border:1px solid var(--brand3)}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#toast.show{display:block;animation:fadeUp .25s ease}
#modal-container{position:fixed;inset:0;z-index:5000;display:flex;align-items:flex-end;justify-content:center}
#cal-modal-container{position:fixed;inset:0;z-index:5100;display:flex;align-items:flex-end;justify-content:center}
#cal-modal-container:empty{display:none}
#modal-container:empty{display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:22px 18px 36px;animation:slideSheet .28s cubic-bezier(.32,1,.36,1);position:relative;z-index:1;box-shadow:0 -8px 40px rgba(0,0,0,.3)}
@keyframes slideSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet h3{font-family:'Libre Baskerville',serif;font-size:18px;font-weight:700;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.cal-picker{background:var(--surface);border-radius:14px;overflow:hidden}
.cal-nav{background:var(--brand);color:var(--gold);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.cal-nav h4{font-family:'Libre Baskerville',serif;font-size:15px;font-weight:700}
.cal-nav button{background:none;border:none;color:var(--gold);font-size:20px;cursor:pointer;padding:4px 10px;border-radius:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{padding:8px 2px;text-align:center;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase}
.cal-day{padding:10px 2px;text-align:center;font-size:13px;cursor:pointer;border-radius:10px;margin:2px;transition:.12s;position:relative}
.cal-day:hover{background:var(--cream)}
.cal-day.today-d{background:#fffbe8;font-weight:700;color:var(--brand)}
.cal-day.selected{background:var(--gold);color:var(--brand);font-weight:700;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;margin:2px auto}
.cal-day.has-data::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:var(--green);border-radius:50%}
.cal-day.empty{cursor:default;opacity:0}
.month-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden}
.month-cal-hd{background:var(--brand);color:var(--gold);text-align:center;padding:8px 2px;font-size:9px;font-weight:700;text-transform:uppercase}
.month-cal-day{background:var(--surface);min-height:64px;padding:5px;cursor:pointer;transition:.1s;position:relative;overflow:hidden}
.month-cal-day:hover{background:var(--cream)}
.month-cal-day.today-cal{background:#fffbe4}
.month-cal-day .day-num{font-size:11px;font-weight:700;color:var(--muted)}
.month-cal-day .day-sale{font-size:10px;font-weight:700;color:var(--green);margin-top:2px}
.month-cal-day .day-exp{font-size:9px;color:var(--red)}
.month-cal-day .day-festival{font-size:8px;color:var(--orange);margin-top:1px;line-height:1.2}
.month-cal-day.empty-cal{background:var(--bg);cursor:default}
.tab-row{display:flex;border-bottom:2px solid var(--border);background:var(--surface);padding:0 16px}
.tab-btn{padding:11px 13px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:.15s;white-space:nowrap}
.tab-btn.active{color:var(--brand);border-bottom-color:var(--gold-dim)}
.emp-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.emp-chip{padding:8px 14px;border-radius:24px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;box-shadow:var(--shadow)}
.emp-chip.active{background:var(--brand);color:var(--gold);border-color:var(--brand)}
.emp-chip.inactive-chip{opacity:.45;text-decoration:line-through}
.prog-wrap{background:#e8d5a8;border-radius:6px;height:8px;overflow:hidden;margin-top:5px}
.prog-bar{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
#fab{position:fixed;bottom:78px;right:16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--brand);font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(232,164,32,.55);display:none;align-items:center;justify-content:center;z-index:400;transition:all .2s;font-weight:300;line-height:1}
#fab:active{transform:scale(.9)}
#fab.show{display:flex;animation:popIn .2s cubic-bezier(.32,1.5,.36,1)}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.more-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.more-card:active{background:var(--cream);transform:scale(.97)}
.more-card .mc-ico{font-size:28px;display:block;margin-bottom:7px}
.more-card .mc-lbl{font-size:11px;font-weight:700;color:var(--text)}
.more-card .mc-sub{font-size:10px;color:var(--muted);margin-top:2px}
.ie{padding:6px 8px;border:1.5px solid var(--gold-dim);border-radius:8px;font-size:12px;background:#fffbe6;font-family:'DM Sans',sans-serif}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--gold);background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;padding:4px 0;margin-bottom:10px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .eico{font-size:52px;display:block;margin-bottom:12px;opacity:.7}
.empty p{font-size:13px;line-height:1.6}
.chip-festival{display:inline-block;background:var(--gold-pale);color:var(--orange);padding:2px 8px;border-radius:12px;font-size:9px;font-weight:700;margin-left:5px;border:1px solid #fde68a}
.summary-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;box-shadow:var(--shadow)}
.bar-chart{display:flex;flex-direction:column;gap:7px;padding:4px 0}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11px}
.bar-label{width:60px;text-align:right;color:var(--muted);font-size:10px;font-weight:600}
.bar-track{flex:1;height:22px;background:var(--cream);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.bar-val{font-size:10px;font-weight:700;color:rgba(255,255,255,.95);white-space:nowrap}
.search-box{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px}
.search-box input{border:none;outline:none;flex:1;font-size:13px;background:transparent;font-family:'DM Sans',sans-serif}
.chart-card-bd{padding:12px 14px 16px}
.chart-wrap{position:relative;width:100%;overflow:hidden}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;justify-content:center}
.chart-leg-item{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--muted)}
.chart-leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.bold{font-weight:700}.ts{color:var(--green);font-weight:700}.td{color:var(--red);font-weight:700}.tw2{color:var(--orange);font-weight:700}.tm{color:var(--muted)}.tr{text-align:right}
.divider{height:1px;background:var(--border);margin:12px 0}
.inactive{opacity:.42;text-decoration:line-through}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-enter{animation:slideIn .22s ease}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr)}.more-grid{grid-template-columns:repeat(4,1fr)}#main-scroll{padding:16px 20px 24px}.modal-sheet{border-radius:20px;margin-bottom:0;max-height:80vh}#modal-container{align-items:center}#cal-modal-container{align-items:center}}
@media(min-width:960px){#app{max-width:800px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.2)}}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media print {
  .no-print { display: none !important; }
  .receipt-print { background: white !important; color: black !important; font-family: 'Courier New', monospace; padding: 20px; max-width: 300px; margin: 0 auto; }
  .receipt-print .receipt-title { font-size: 18px; font-weight: bold; text-align: center; }
  .receipt-print .receipt-divider { border-top: 1px dashed #333; margin: 8px 0; }
  .receipt-print .receipt-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .receipt-print .receipt-total { font-size: 16px; font-weight: bold; }
  body { background: white; margin: 0; }
  .modal-overlay, .modal-sheet { background: none !important; box-shadow: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <header id="app-header">
    <h1 id="hdr-title">🪔 Bhakta Mithai <span>v4</span></h1>
    <div class="hdr-badge" id="saved-badge">✓ Saved</div>
    <select id="fy-selector" onchange="switchFY(this.value)"></select>
  </header>
  <div id="main-scroll"></div>
  <nav id="bottom-nav">

function bsToAdDays(y,m,d){const BASE=2075;let t=0,e2=0;for(let yr=BASE;yr<y;yr++)for(let mo=1;mo<=12;mo++)t+=getMonthDays(yr,mo);for(let mo=1;mo<m;mo++)t+=getMonthDays(y,mo);t+=(d-1);for(let yr=BASE;yr<BS_EPOCH_BS.y;yr++)for(let mo=1;mo<=12;mo++)e2+=getMonthDays(yr,mo);for(let mo=1;mo<BS_EPOCH_BS.m;mo++)e2+=getMonthDays(BS_EPOCH_BS.y,mo);e2+=(BS_EPOCH_BS.d-1);return t-e2;}
function getTodayBS(){const today=new Date();today.setHours(0,0,0,0);let diff=Math.floor((today-BS_EPOCH_AD)/86400000);let y=BS_EPOCH_BS.y,m=1,d=1;while(diff>0){const md=getMonthDays(y,m),rem=md-d;if(diff<=rem){d+=diff;diff=0;}else{diff-=(rem+1);d=1;m++;if(m>12){m=1;y++;}}}while(diff<0){if(d>1){d--;diff++;}else{if(m===1){y--;m=12;}else{m--;}d=getMonthDays(y,m);diff++;}}return{year:y,month:m,day:d,str:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,monthStr:`${y}-${String(m).padStart(2,'0')}`,totalDays:getMonthDays(y,m)};}
function bsStartWeekday(y,m){return ((1+bsToAdDays(y,m,1))%7+7)%7;}

function fmt(n){if(n===undefined||n===null)return'—';const abs=Math.abs(n);let s;if(abs>=10000000)s=`${(abs/10000000).toFixed(2)}Cr`;else if(abs>=100000)s=`${(abs/100000).toFixed(2)}L`;else if(abs>=1000)s=`${(abs/1000).toFixed(1)}K`;else s=String(Math.round(abs));return(n<0?'-':'')+'रू'+s;}
function isValidBSDate(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;const[y,m,dd]=d.split('-').map(Number);if(m<1||m>12)return false;return dd>=1&&dd<=getMonthDays(y,m);}
function getFYMonths(fy){const a=[];for(let m=4;m<=12;m++)a.push(`${fy}-${String(m).padStart(2,'0')}`);for(let m=1;m<=3;m++)a.push(`${fy+1}-${String(m).padStart(2,'0')}`);return a;}
function getFYLabel(fy){return `FY ${fy}/${String(fy+1).slice(-2)}`;}

function prevMonth(m){const[y,mo]=m.split('-').map(Number);return mo===1?`${y-1}-12`:`${y}-${String(mo-1).padStart(2,'0')}`;}
function nextMonth(m){const[y,mo]=m.split('-').map(Number);return mo===12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,'0')}`;}
function isEmployeeActive(emp,m){if(!emp.startDate)return false;const s=emp.startDate.slice(0,7),e=emp.endDate?emp.endDate.slice(0,7):null;return s<=m&&(!e||m<=e);}
function getEmpEarned(emp,m,bonuses,unpaidLeaves){if(!isEmployeeActive(emp,m))return 0;const u=(unpaidLeaves?.[emp.name]?.[m])||0;const ded=u>0?Math.round((emp.salary/30)*u):0;return emp.salary-ded+((bonuses[emp.name]&&bonuses[emp.name][m])||0);}
function getTotalSalaryPaid(m,data){const pm=prevMonth(m);return data.employees.reduce((s,emp)=>s+getEmpEarned(emp,pm,data.bonuses,data.unpaidLeaves||{}),0);}

// ── CALCULATIONS ───────────────────────────────────────────────────────────────
function calcSlabTax(taxableIncome){let remaining=Math.max(0,taxableIncome),total=0;const breakdown=appConfig.taxSlabs.map(s=>{const slabSize=s.limit>=SLAB_MAX?remaining:s.limit;const income=Math.max(0,Math.min(remaining,slabSize));const tax=income*s.rate;remaining-=income;total+=tax;return{limit:s.limit,rate:s.rate,income,tax};});return{total,breakdown};}
function calcFY(fy,data=currentData){const months=getFYMonths(fy);const mSales={},mExp={},empAdv={};data.sales.forEach(s=>{const m=s.date.slice(0,7);mSales[m]=(mSales[m]||0)+saleTotal(s)});data.expenses.forEach(e=>{const m=e.date.slice(0,7);mExp[m]=(mExp[m]||0)+e.amount});data.advances.forEach(a=>{if(!empAdv[a.employee])empAdv[a.employee]={};const m=a.date.slice(0,7);empAdv[a.employee][m]=(empAdv[a.employee][m]||0)+a.amount});const rows=months.map(m=>{const sales=mSales[m]||0,expenses=mExp[m]||0,salary=getTotalSalaryPaid(m,data);const net=sales-expenses-salary;const festivals=(FESTIVALS[parseInt(m.split('-')[1])])||[];return{month:m,name:getMonthName(m),sales,expenses,salary,net,tax:0,festivals};});const tS=rows.reduce((s,r)=>s+r.sales,0),tE=rows.reduce((s,r)=>s+r.expenses,0),tSl=rows.reduce((s,r)=>s+r.salary,0),tN=rows.reduce((s,r)=>s+r.net,0);const totalTaxProper=calcSlabTax(tN).total;const positiveNetSum=rows.reduce((s,r)=>s+Math.max(0,r.net),0);rows.forEach(r=>{r.tax=positiveNetSum>0?Math.round(totalTaxProper*Math.max(0,r.net)/positiveNetSum):0;});const savBal=(data.savings||[]).reduce((s,t)=>s+(t.type==='in'?t.amount:-t.amount),0);const lastM=`${fy+1}-03`;const outSalary=data.employees.reduce((s,emp)=>s+getEmpEarned(emp,lastM,data.bonuses,data.unpaidLeaves||{}),0);return{rows,totalSales:tS,totalExpenses:tE,totalSalary:tSl,totalNet:tN,totalTax:Math.round(totalTaxProper),employeeAdvances:empAdv,outstandingSalary:outSalary,savingsBalance:savBal};}

function renderDashboardCharts(){if(typeof Chart==='undefined')return;const calc=calcFY(appConfig.currentFY);const rows=calc.rows;const labels=rows.map(r=>r.name.slice(0,5));const hasData=rows.some(r=>r.sales>0);if(!hasData)return;const chartDefaults={responsive:true,maintainAspectRatio:true,plugins:{tooltip:{callbacks:{label:ctx=>fmt(ctx.raw)}},legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmt(v),font:{size:9},color:'#7a5830'},grid:{color:'rgba(26,8,0,.04)'},border:{display:false}},x:{ticks:{font:{size:9},color:'#7a5830',maxRotation:35},grid:{display:false},border:{display:false}}}};const ctx1=document.getElementById('chartSales')?.getContext('2d');if(ctx1){chartInstances.push(new Chart(ctx1,{type:'bar',data:{labels,datasets:[{label:'Sales',data:rows.map(r=>r.sales),backgroundColor:'rgba(15,122,60,.72)',borderColor:'#0f7a3c',borderWidth:1,borderRadius:4,borderSkipped:false}]},options:{...chartDefaults,plugins:{...chartDefaults.plugins,legend:{display:false}}}}));}const ctx2=document.getElementById('chartCosts')?.getContext('2d');if(ctx2){chartInstances.push(new Chart(ctx2,{type:'bar',data:{labels,datasets:[{label:'Expenses',data:rows.map(r=>r.expenses),backgroundColor:'rgba(196,24,24,.7)',borderColor:'#c41818',borderWidth:1,borderRadius:3,borderSkipped:false},{label:'Salary',data:rows.map(r=>r.salary),backgroundColor:'rgba(200,106,0,.7)',borderColor:'#c86a00',borderWidth:1,borderRadius:3,borderSkipped:false}]},options:{...chartDefaults,plugins:{...chartDefaults.plugins,legend:{display:true,labels:{font:{size:9},boxWidth:10,color:'#7a5830',padding:10}}}}}));}const ctx3=document.getElementById('chartNet')?.getContext('2d');if(ctx3){const netColors=rows.map(r=>r.net>=0?'rgba(15,122,60,.75)':'rgba(196,24,24,.7)');const netBorders=rows.map(r=>r.net>=0?'#0f7a3c':'#c41818');chartInstances.push(new Chart(ctx3,{type:'bar',data:{labels,datasets:[{label:'Net Profit/Loss',data:rows.map(r=>r.net),backgroundColor:netColors,borderColor:netBorders,borderWidth:1,borderRadius:4,borderSkipped:false}]},options:{...chartDefaults,scales:{...chartDefaults.scales,y:{...chartDefaults.scales.y,beginAtZero:false}}}}));}}

function showBSPicker(inputId,onSelect){const cur=document.getElementById(inputId)?.value||'';const parts=cur.split('-');const today=getTodayBS();let y=today.year,m=today.month,d=today.day;if(parts.length===3&&isValidBSDate(cur)){y=parseInt(parts[0]);m=parseInt(parts[1]);d=parseInt(parts[2]);}let pickerY=y,pickerM=m;const renderCal=()=>{const maxD=getMonthDays(pickerY,pickerM);const startDow=bsStartWeekday(pickerY,pickerM);const festivals=FESTIVALS[pickerM]||[];const monthKey=`${pickerY}-${String(pickerM).padStart(2,'0')}`;const daysWithSales=new Set(currentData.sales.filter(s=>s.date.startsWith(monthKey)).map(s=>parseInt(s.date.split('-')[2])));let cells='';for(let i=0;i<startDow;i++)cells+=`<div class="cal-day empty"></div>`;for(let dd=1;dd<=maxD;dd++){const isToday=(pickerY===today.year&&pickerM===today.month&&dd===today.day);const isSel=(pickerY===window._calY&&pickerM===window._calM&&dd===window._calD);cells+=`<div class="cal-day ${isToday?'today-d':''} ${isSel?'selected':''} ${daysWithSales.has(dd)?'has-data':''}" onclick="pickDay(event,'${inputId}',${pickerY},${pickerM},${dd})">${dd}</div>`;}return`<div class="cal-picker"><div class="cal-nav"><button onclick="shiftCalMonth(-1)">‹</button><h4>${NM[pickerM]} ${pickerY} BS</h4><button onclick="shiftCalMonth(1)">›</button></div><div style="padding:10px 12px">${festivals.length?`<div style="font-size:10px;color:var(--orange);margin-bottom:8px;font-weight:600">🎉 ${festivals.slice(0,2).join(' · ')}</div>`:''}<div class="cal-grid">${DOW.map(dw=>`<div class="cal-dow">${dw}</div>`).join('')}${cells}</div></div></div>`;};window._calInputId=inputId;window._calOnSelect=onSelect;window._calY=y;window._calM=m;window._calD=d;document.getElementById('cal-modal-container').innerHTML=`<div class="modal-overlay" onclick="closeCalModal()"></div><div class="modal-sheet" style="border-radius:22px 22px 0 0;padding-bottom:28px"><div class="modal-handle"></div><h3>📅 Select BS Date</h3><div id="cal-inner">${renderCal()}</div><div class="modal-actions"><button class="btn btn-s" onclick="closeCalModal()">Cancel</button><button class="btn btn-gold" onclick="confirmCalPick('${inputId}')">Confirm</button></div></div>`;window.shiftCalMonth=(dir)=>{pickerM+=dir;if(pickerM>12){pickerM=1;pickerY++;}if(pickerM<1){pickerM=12;pickerY--;}document.getElementById('cal-inner').innerHTML=renderCal();};}
window.pickDay=function(ev,inputId,y,m,d){window._calY=y;window._calM=m;window._calD=d;document.querySelectorAll('.cal-day').forEach(el=>el.classList.remove('selected'));ev.target.closest('.cal-day').classList.add('selected');}
function closeCalModal(){document.getElementById('cal-modal-container').innerHTML='';}
window.closeCalModal=closeCalModal;
window.confirmCalPick=function(inputId){const val=`${window._calY}-${String(window._calM).padStart(2,'0')}-${String(window._calD).padStart(2,'0')}`;const inp=document.getElementById(inputId);if(inp)inp.value=val;if(window._calOnSelect)window._calOnSelect(val);closeCalModal();}

function openQuickAdd(){if(currentPage==='expenses'){openAddExpenseModal();return;}if(currentPage==='advances'){openAddAdvanceModal();return;}openAddSaleModal();}
function openAddSaleModal(){const today=getTodayBS();const chans=appConfig.saleChannels;const existing=currentData.sales.find(s=>s.date===today.str);document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModal()"></div><div class="modal-sheet"><div class="modal-handle"></div><h3>💰 Add Sales Entry</h3>${existing?`<div class="ib ib-y">⚠️ <div>Entry already exists for ${today.str}. Adding creates a 2nd entry.</div></div>`:''}<div style="display:flex;flex-direction:column;gap:12px"><div class="fg"><label>Date (BS)</label><div class="date-row"><input id="qs-date" value="${today.str}"><button class="btn btn-s" onclick="showBSPicker('qs-date')">📅</button></div></div><div class="form-row">${chans.map(c=>`<div class="fg"><label>${c.label}</label><input id="qs-amt-${c.key}" type="number" placeholder="0" min="0"></div>`).join('')}</div><div id="qs-preview" style="background:var(--gold-pale);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;display:none">Total: <span id="qs-prev-val"></span></div><div class="fg"><label>Note (optional)</label><input id="qs-note" placeholder="e.g. Festival rush, heavy rain…"></div></div><div class="modal-actions"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-gold btn-full" onclick="submitSaleModal()">💾 Save Entry</button></div>`;const ids=chans.map(c=>'qs-amt-'+c.key);const upd=()=>{const t=ids.reduce((s,id)=>s+(parseFloat(document.getElementById(id)?.value)||0),0);const p=document.getElementById('qs-preview');const v=document.getElementById('qs-prev-val');if(t>0){p.style.display='block';v.textContent=fmt(t);}else p.style.display='none';};setTimeout(()=>{ids.forEach(id=>document.getElementById(id)?.addEventListener('input',upd));document.getElementById(ids[0])?.focus();},50);}
window.submitSaleModal=function(){const date=document.getElementById('qs-date')?.value.trim();if(!isValidBSDate(date)){alert('Invalid date');return;}const amounts={};let hasAny=false;appConfig.saleChannels.forEach(c=>{const v=parseFloat(document.getElementById('qs-amt-'+c.key)?.value)||0;amounts[c.key]=v;if(v)hasAny=true;});const note=document.getElementById('qs-note')?.value.trim()||'';if(!hasAny){alert('Enter at least one amount');return;}currentData.sales.push({date,amounts,note});saveData();showToast('✓ Sale recorded');closeModal();render();}
function openAddExpenseModal(){const today=getTodayBS();const cats=currentData.categories||DEFAULT_CATEGORIES;document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModal()"></div><div class="modal-sheet"><div class="modal-handle"></div><h3>📊 Add Expense</h3><div style="display:flex;flex-direction:column;gap:12px"><div class="fg"><label>Date (BS)</label><div class="date-row"><input id="qe-date" value="${today.str}"><button class="btn btn-s" onclick="showBSPicker('qe-date')">📅</button></div></div><div class="form-row"><div class="fg"><label>Category</label><select id="qe-cat">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="fg"><label>Amount (रू)</label><input id="qe-amt" type="number" placeholder="0" min="0"></div></div><div class="fg"><label>Description (optional)</label><input id="qe-desc" placeholder="Details…"></div></div><div class="modal-actions"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-gold btn-full" onclick="submitExpModal()">💾 Save Expense</button></div>`;setTimeout(()=>document.getElementById('qe-amt')?.focus(),50);}
window.submitExpModal=function(){const date=document.getElementById('qe-date')?.value.trim();if(!isValidBSDate(date)){alert('Invalid date');return;}const category=document.getElementById('qe-cat')?.value,amount=parseFloat(document.getElementById('qe-amt')?.value),description=document.getElementById('qe-desc')?.value.trim()||'';if(!amount||amount<=0){alert('Enter valid amount');return;}currentData.expenses.push({date,category,amount,description});saveData();showToast('✓ Expense saved');closeModal();render();}
function openAddAdvanceModal(){const activeEmps=currentData.employees.filter(e=>e.status==='active');if(!activeEmps.length){alert('No active employees to record an advance for. Add or reactivate an employee first.');return;}const today=getTodayBS();document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModal()"></div><div class="modal-sheet"><div class="modal-handle"></div><h3>💼 Record Advance</h3><div style="display:flex;flex-direction:column;gap:12px"><div class="fg"><label>Date (BS)</label><div class="date-row"><input id="qa-date" value="${today.str}"><button class="btn btn-s" onclick="showBSPicker('qa-date')">📅</button></div></div><div class="fg"><label>Employee</label><select id="qa-emp">${activeEmps.map(e=>`<option>${e.name}</option>`).join('')}</select></div><div class="fg"><label>Amount (रू)</label><input id="qa-amt" type="number" placeholder="0" min="0"></div><div class="fg"><label>Reason (optional)</label><input id="qa-note" placeholder="e.g. Festival advance…"></div></div><div class="modal-actions"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-gold btn-full" onclick="submitAdvModal()">💾 Save Advance</button></div>`;setTimeout(()=>document.getElementById('qa-amt')?.focus(),50);}
window.submitAdvModal=function(){const date=document.getElementById('qa-date')?.value.trim();if(!isValidBSDate(date)){alert('Invalid date');return;}const employee=document.getElementById('qa-emp')?.value,amount=parseFloat(document.getElementById('qa-amt')?.value),note=document.getElementById('qa-note')?.value.trim()||'';if(!amount||amount<=0){alert('Enter valid amount');return;}currentData.advances.push({date,employee,amount,note});saveData();showToast('✓ Advance recorded');closeModal();render();}

// ── DASHBOARD ──────────────────────────────────────────────────────────────────
function renderDashboard(calc,fy){const prevData=loadFYData(fy-1);let prevCalc=null,yoy='';if(prevData){prevCalc=calcFY(fy-1,prevData);const ch=prevCalc.totalNet!==0?Math.round((calc.totalNet-prevCalc.totalNet)/Math.abs(prevCalc.totalNet)*100):0;yoy=`<span class="${ch>=0?'ts':'td'}">${ch>=0?'▲':'▼'} ${Math.abs(ch)}% vs ${getFYLabel(fy-1)}</span>`;}const vatPct=Math.min(100,Math.round(calc.totalSales/appConfig.vatThreshold*100));const today=getTodayBS();const todayEntries=currentData.sales.filter(s=>s.date===today.str);const todayChanTotals={};appConfig.saleChannels.forEach(c=>todayChanTotals[c.key]=0);todayEntries.forEach(x=>Object.entries(x.amounts||{}).forEach(([k,v])=>{todayChanTotals[k]=(todayChanTotals[k]||0)+(v||0);}));const todayData=todayEntries.length?{amounts:todayChanTotals,total:todayEntries.reduce((s,x)=>s+saleTotal(x),0),note:todayEntries.filter(x=>x.note).map(x=>x.note).join(' · '),count:todayEntries.length}:null;const hasChartData=calc.rows.some(r=>r.sales>0);return`<div class="sec-hd">Today — ${NM[today.month]} ${today.day}, ${today.year} BS</div><div class="today-hero"><div class="hero-date">📅 ${today.str}</div>${todayData?`<div class="hero-amount">${fmt(todayData.total)}</div><div class="hero-sub">${appConfig.saleChannels.map(c=>`${c.label}: ${fmt(todayData.amounts[c.key]||0)}`).join(' · ')}${todayData.count>1?` · <span style="color:var(--gold)">${todayData.count} entries</span>`:''}${todayData.note?`<br><em>"${todayData.note}"</em>`:''}</div><button class="btn btn-s" style="margin-top:12px;color:var(--gold-lt);border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.08)" onclick="openAddSaleModal()">+ Add More</button>`:`<div style="color:#6a4828;font-size:15px;font-weight:600;margin-top:4px">No sales recorded yet</div><button class="hero-add-btn" onclick="openAddSaleModal()">+ Add Today's Sales</button>`}</div><div class="sec-hd">FY ${getFYLabel(fy)} Overview</div><div class="kpi-grid"><div class="kpi"><div class="kpi-stripe" style="background:var(--blue)"></div><label>Total Sales</label><div class="kv ts">${fmt(calc.totalSales)}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--red)"></div><label>Expenses</label><div class="kv td">${fmt(calc.totalExpenses)}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--orange)"></div><label>Salary Paid</label><div class="kv tw2">${fmt(calc.totalSalary)}</div></div><div class="kpi"><div class="kpi-stripe" style="background:var(--green)"></div><label>Net Profit</label><div class="kv ${calc.totalNet>=0?'ts':'td'}">${fmt(calc.totalNet)}</div><div class="ks">${yoy||getFYLabel(fy)}</div></div></div>${calc.savingsBalance>0?`<div class="kpi" style="margin-bottom:14px"><div class="kpi-stripe" style="background:#059669"></div><label>Savings Fund</label><div class="kv" style="color:#059669">${fmt(calc.savingsBalance)}</div></div>`:''}${hasChartData?`<div class="card"><div class="card-hd"><h3>📈 Monthly Sales — ${getFYLabel(fy)}</h3></div><div class="chart-card-bd"><div class="chart-wrap"><canvas id="chartSales" height="180"></canvas></div></div></div><div class="card"><div class="card-hd"><h3>📊 Expenses & Salary</h3><small>By month</small></div><div class="chart-card-bd"><div class="chart-wrap"><canvas id="chartCosts" height="180"></canvas></div></div></div><div class="card"><div class="card-hd"><h3>💹 Net Profit / Loss</h3><small>Green = profit · Red = loss</small></div><div class="chart-card-bd"><div class="chart-wrap"><canvas id="chartNet" height="170"></canvas></div></div></div>`:''}<div class="ib ib-b"><span>💰</span><div style="flex:1"><b>VAT Threshold — ${fmt(appConfig.vatThreshold)}</b><div class="prog-wrap" style="margin-top:6px"><div class="prog-bar" style="width:${vatPct}%;background:${vatPct>90?'var(--red)':vatPct>70?'var(--orange)':'var(--green)'}"></div></div><div style="font-size:10px;margin-top:4px">${fmt(calc.totalSales)} · ${vatPct}% used${vatPct>=100?` <b style="color:var(--red)">⚠️ Register for VAT!</b>`:''}</div></div></div>${calc.outstandingSalary>0?`<div class="ib ib-y">⚠️ <div><b>Outstanding Salary:</b> ${fmt(calc.outstandingSalary)} payable next FY</div></div>`:''}<div class="card"><div class="card-hd"><h3>📅 Monthly Overview</h3><small>${getFYLabel(fy)}</small></div><div class="tbl-wrap"><table><thead><tr><th>Month</th><th class="tr">Sales</th><th class="tr">Expenses</th><th class="tr">Salary</th><th class="tr">Net</th><th>Status</th></tr></thead><tbody>${calc.rows.map(r=>`<tr><td><span class="bold">${r.name}</span>${r.festivals.length?`<span class="chip-festival">${r.festivals[0].slice(0,8)}</span>`:''}</td><td class="tr ts">${r.sales>0?fmt(r.sales):'—'}</td><td class="tr td">${r.expenses>0?fmt(r.expenses):'—'}</td><td class="tr tw2">${r.salary>0?fmt(r.salary):'—'}</td><td class="tr ${r.net>0?'ts':r.net<0?'td':'tm'}">${r.sales>0||r.salary>0?fmt(r.net):'—'}</td><td><span class="tag ${r.net>0?'tg':r.net<0?'tr-tag':r.sales>0?'tw':''}">${r.net>0?'Profit':r.net<0?'Loss':r.sales>0?'Break-even':'Pending'}</span></td></tr>`).join('')}<tr class="tr-total"><td>FY TOTAL</td><td class="tr ts">${fmt(calc.totalSales)}</td><td class="tr td">${fmt(calc.totalExpenses)}</td><td class="tr tw2">${fmt(calc.totalSalary)}</td><td class="tr ${calc.totalNet>=0?'ts':'td'}">${fmt(calc.totalNet)}</td><td></td></tr></tbody></table></div></div>${prevCalc?`<div class="card"><div class="card-hd"><h3>📊 Year-on-Year</h3><small>${getFYLabel(fy-1)} vs ${getFYLabel(fy)}</small></div><div class="tbl-wrap"><table><thead><tr><th>Metric</th><th class="tr">${getFYLabel(fy-1)}</th><th class="tr">${getFYLabel(fy)}</th><th class="tr">Change</th></tr></thead><tbody>${[['Sales',prevCalc.totalSales,calc.totalSales,false],['Expenses',prevCalc.totalExpenses,calc.totalExpenses,true],['Salary',prevCalc.totalSalary,calc.totalSalary,true],['Net Profit',prevCalc.totalNet,calc.totalNet,false]].map(([l,pr,cu,inv])=>{const d2=cu-pr,p=pr!==0?Math.round(d2/Math.abs(pr)*100):0,pos=inv?d2<=0:d2>=0;return`<tr><td class="bold">${l}</td><td class="tr tm">${fmt(pr)}</td><td class="tr">${fmt(cu)}</td><td class="tr"><span class="${pos?'ts':'td'}">${d2>=0?'▲':'▼'} ${Math.abs(p)}%</span></td></tr>`;}).join('')}</tbody></table></div></div>`:''}`;}

// ── SALES ──────────────────────────────────────────────────────────────────────
function renderSales(){const chans=appConfig.saleChannels;const today=getTodayBS();let items=[...currentData.sales].map((s,i)=>({...s,i})).sort((a,b)=>b.date.localeCompare(a.date));if(searchQuery){const q=searchQuery.toLowerCase();items=items.filter(s=>s.date.includes(q)||(s.note||'').toLowerCase().includes(q));}const total=currentData.sales.reduce((s,x)=>s+saleTotal(x),0);const sb=`<div class="card-bd" style="padding-bottom:4px"><div class="search-box">🔍 <input placeholder="Search date or note…" value="${searchQuery}" oninput="searchQuery=this.value;render()"></div></div>`;if(!currentData.sales.length)return`<div class="card"><div class="card-hd"><h3>📋 Sales Records</h3><button class="btn-icon" onclick="openLabelModal()">⚙️</button></div>${sb}<div class="empty"><span class="eico">💰</span><p>No sales yet.<br>Tap <b>+</b> to add your first entry.</p></div></div>`;return`<div class="card"><div class="card-hd"><h3>📋 Sales Records</h3><div style="display:flex;gap:8px;align-items:center"><small>Total: <b class="ts">${fmt(total)}</b></small><button class="btn-icon" onclick="openLabelModal()">⚙️</button></div></div>${sb}<div class="tbl-wrap"><table><thead><tr><th>Date</th>${chans.map(c=>`<th class="tr">${c.label}</th>`).join('')}<th class="tr">Total</th><th></th></tr></thead><tbody>${items.map(s=>{const isToday=s.date===today.str;if(editIndex.sale===s.i)return`<tr><td><input class="ie" id="es-date" value="${s.date}" style="width:88px"><button class="btn btn-s" onclick="showBSPicker('es-date')" style="padding:4px 6px">📅</button></td>${chans.map(c=>`<td><input class="ie" id="es-amt-${c.key}" type="number" value="${saleAmt(s,c.key)}" style="width:68px"></td>`).join('')}<td><input class="ie" id="es-note" value="${s.note||''}" placeholder="note" style="width:80px"></td><td style="display:flex;gap:3px"><button class="btn btn-g btn-s" onclick="saveSaleEdit(${s.i})">✓</button><button class="btn btn-s" onclick="cancelSaleEdit()">✕</button></td></tr>`;const t=saleTotal(s);return`<tr${isToday?' class="tr-today"':''}><td><span class="bold">${s.date}</span>${isToday?'<span class="chip-festival">Today</span>':''}<br>${s.note?`<span style="font-size:10px;color:var(--muted);font-style:italic">${s.note}</span>`:''}</td>${chans.map(c=>`<td class="tr">${saleAmt(s,c.key)?fmt(saleAmt(s,c.key)):'—'}</td>`).join('')}<td class="tr ts bold">${fmt(t)}</td><td style="display:flex;gap:3px"><button class="btn btn-s" onclick="startSaleEdit(${s.i})">✏️</button><button class="btn btn-s" onclick="generateReceipt(${s.i})" title="Print Receipt">🧾</button><button class="btn btn-d btn-s" onclick="deleteSale(${s.i})">✕</button></td></tr>`;}).join('')}<tr class="tr-total"><td colspan="${1+chans.length}">Total (${currentData.sales.length} entries)</td><td class="tr ts">${fmt(total)}</td><td></td></tr></tbody></table></div></div>`;}
function startSaleEdit(i){editIndex.sale=i;render();}
function cancelSaleEdit(){editIndex.sale=-1;render();}
function saveSaleEdit(i){const date=document.getElementById('es-date')?.value;if(!isValidBSDate(date)){alert('Invalid date');return;}const amounts={};appConfig.saleChannels.forEach(c=>{amounts[c.key]=parseFloat(document.getElementById('es-amt-'+c.key)?.value)||0;});currentData.sales[i]={...currentData.sales[i],date,amounts,note:document.getElementById('es-note')?.value.trim()||''};editIndex.sale=-1;saveData();showToast('✓ Updated');render();}
function deleteSale(i){if(!confirm('Delete this entry?'))return;currentData.sales.splice(i,1);saveData();render();}
function openLabelModal(){document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModal()"></div><div class="modal-sheet"><div class="modal-handle"></div><h3>⚙️ Sales Channels</h3><div style="font-size:11px;color:var(--muted);margin-bottom:10px">Rename, remove, or add the columns used to record sales. Deleting a channel keeps its past data in your totals but hides it from new entries.</div><div id="chan-list" style="display:flex;flex-direction:column;gap:10px">${appConfig.saleChannels.map((c,i)=>`<div class="fg" style="display:flex;align-items:flex-end;gap:8px"><div style="flex:1"><label>Channel ${i+1}</label><input class="chan-inp" data-key="${c.key}" value="${c.label}"></div><button class="btn btn-d btn-s" onclick="removeChannel('${c.key}')" ${appConfig.saleChannels.length<=1?'disabled title="At least one channel is required"':''}>✕</button></div>`).join('')}</div><button class="btn btn-s btn-full" style="margin-top:10px" onclick="addChannel()">+ Add Channel</button><div class="modal-actions"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="saveLabels()">Save</button></div></div>`;}
window.addChannel=function(){const label=prompt('Name for the new sales channel:');if(!label||!label.trim())return;const key='ch_'+Date.now();appConfig.saleChannels.push({key,label:label.trim()});openLabelModal();}
window.removeChannel=function(key){if(appConfig.saleChannels.length<=1){alert('At least one channel is required.');return;}if(!confirm('Remove this channel? Past recorded amounts under it are kept in your totals, but you will no longer be able to enter new amounts for it.'))return;appConfig.saleChannels=appConfig.saleChannels.filter(c=>c.key!==key);openLabelModal();}

    `}
  </div><div class="card"><div class="card-hd"><h3>🏷️ Categories</h3><small>${cats.length} total</small></div><div style="display:flex;flex-wrap:wrap;gap:7px;padding:12px 16px">${cats.map((c,i)=>`<div style="display:flex;align-items:center;gap:3px;background:${DEFAULT_CATEGORIES.includes(c)?'var(--cream)':'#fffbe6'};border:1px solid var(--border);border-radius:20px;padding:5px 11px;font-size:12px"><span>${c}</span>${!DEFAULT_CATEGORIES.includes(c)?`<button style="background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:0 2px;line-height:1" onclick="deleteCategory(${i})">×</button>`:''}</div>`).join('')}</div><div style="display:flex;gap:8px;padding:4px 16px 16px"><input id="new-cat" placeholder="New category name" style="flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px"><button class="btn btn-p" onclick="addCategory()">+ Add</button></div></div>`;}

function renderEmployees(){const statusTag={active:'tg',left:'tw',fired:'tr-tag'};return staffSubNav()+`<div class="card"><div class="card-hd"><h3>➕ Add Employee</h3></div><div class="form-panel"><div class="form-row"><div class="fg"><label>Full Name</label><input id="en-name" placeholder="Full name"></div><div class="fg"><label>Monthly Salary (रू)</label><input id="en-sal" type="number" placeholder="e.g. 15000" min="0"></div></div><div class="form-row"><div class="fg"><label>Start Date (BS)</label><div class="date-row"><input id="en-start" placeholder="2082-04-01"><button class="btn btn-s" onclick="showBSPicker('en-start')">📅</button></div></div><div class="fg"><label>Role / Note</label><input id="en-note" placeholder="e.g. Cook"></div></div><button class="btn btn-gold btn-full" onclick="addEmployee()">+ Add Employee</button></div></div><div class="card"><div class="card-hd"><h3>👥 All Employees</h3><small>${currentData.employees.filter(e=>e.status==='active').length} active of ${currentData.employees.length}</small></div>${currentData.employees.length===0?`<div class="empty"><span class="eico">👥</span><p>No employees yet</p></div>`:`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Name</th><th class="tr">Salary/mo</th><th>Start</th><th>Status</th><th>Role</th><th></th></tr></thead><tbody>${currentData.employees.map((e,i)=>`<tr><td class="tm" style="font-size:11px">${i+1}</td><td class="bold">${e.name}</td><td class="tr">${editIndex.employee===i&&editField==='salary'?`<input class="ie" id="ee-sal-${i}" type="number" value="${e.salary}" style="width:80px"><button class="btn btn-g btn-s" onclick="saveEmpField(${i},'salary')">✓</button><button class="btn btn-s" onclick="cancelEmpEdit()">✕</button>`:fmt(e.salary)}</td><td class="tm" style="font-size:11px">${editIndex.employee===i&&editField==='startDate'?`<input class="ie" id="ee-sal-${i}" value="${e.startDate||''}" placeholder="2082-04-01" style="width:90px"><button class="btn btn-g btn-s" onclick="saveEmpField(${i},'startDate')">✓</button><button class="btn btn-s" onclick="cancelEmpEdit()">✕</button>`:(e.startDate||'—')}</td><td><span class="dot dot-${e.status==='active'?'g':e.status==='left'?'o':'r'}"></span><span class="tag ${statusTag[e.status]||'tg'}">${e.status}</span></td><td class="tm" style="font-size:11px">${e.note||'—'}</td><td><div style="display:flex;gap:3px;flex-wrap:wrap"><button class="btn btn-s" onclick="startEmpEdit(${i},'salary')">✏️Sal</button><button class="btn btn-s" onclick="startEmpEdit(${i},'startDate')">📅</button>${e.status==='active'?`<button class="btn btn-w btn-s" onclick="showLeaveModal(${i})">🚪</button>`:`<button class="btn btn-s" onclick="reactivateEmployee(${i})">↩️</button>`}<button class="btn btn-d btn-s" onclick="deleteEmployee(${i})">✕</button></div></td></tr>`).join('')}</tbody></table></div>`}</div>`;}
function addEmployee(){const name=document.getElementById('en-name')?.value.trim();if(!name){alert('Enter a name');return;}if(currentData.employees.find(e=>e.name===name)){alert('Already exists');return;}const salary=parseFloat(document.getElementById('en-sal')?.value);if(!salary||salary<=0){alert('Enter valid salary');return;}const startDate=document.getElementById('en-start')?.value.trim();if(!isValidBSDate(startDate)){alert('Enter valid start date');return;}const note=document.getElementById('en-note')?.value.trim()||'';currentData.employees.push({name,salary,startDate,endDate:null,status:'active',note});saveData();showToast('✓ Employee added');render();}
function startEmpEdit(i,field){editIndex.employee=i;editField=field;render();setTimeout(()=>document.getElementById(`ee-sal-${i}`)?.focus(),50);}
function cancelEmpEdit(){editIndex.employee=-1;editField='';render();}
function saveEmpField(i,field){const val=document.getElementById(`ee-sal-${i}`)?.value;if(field==='salary'){const n=parseFloat(val);if(!n||n<=0){alert('Invalid');return;}currentData.employees[i].salary=n;}else if(field==='startDate'){if(!isValidBSDate(val)){alert('Invalid date');return;}currentData.employees[i].startDate=val;}editIndex.employee=-1;editField='';saveData();showToast('✓ Updated');render();}
function deleteEmployee(i){if(!confirm('Delete employee and all records?'))return;const name=currentData.employees[i].name;currentData.employees.splice(i,1);currentData.advances=currentData.advances.filter(a=>a.employee!==name);delete currentData.bonuses[name];if(currentData.unpaidLeaves)delete currentData.unpaidLeaves[name];saveData();render();}
function reactivateEmployee(i){if(!confirm('Reactivate?'))return;currentData.employees[i].endDate=null;currentData.employees[i].status='active';saveData();render();}
function showLeaveModal(i){const today=getTodayBS();const emp=currentData.employees[i];const calc=calcFY(appConfig.currentFY);const totalAdv=Object.values(calc.employeeAdvances[emp.name]||{}).reduce((s,v)=>s+v,0);let earned=0;const months=getFYMonths(appConfig.currentFY);months.forEach(m=>{if(isEmployeeActive(emp,m)&&m<today.monthStr)earned+=getEmpEarned(emp,m,currentData.bonuses,currentData.unpaidLeaves||{});else if(m===today.monthStr&&isEmployeeActive(emp,m))earned+=Math.round(emp.salary/30*today.day);});const settlement=earned-totalAdv;document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModal()"></div><div class="modal-sheet"><div class="modal-handle"></div><h3>🚪 Final Settlement — ${emp.name}</h3><div style="background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:14px">${[['Salary Earned (FY to date)',earned,'ts'],['Total Advances',totalAdv,'td'],['NET PAYABLE',settlement,settlement>=0?'ts':'td']].map(([l,v,c])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${l}</span><span class="${c} bold">${fmt(Math.abs(v))}</span></div>`).join('')}${settlement<0?`<div class="ib ib-r" style="margin-top:8px;font-size:11px">⚠️ Employee owes ${fmt(Math.abs(settlement))}</div>`:`<div class="ib ib-g" style="margin-top:8px;font-size:11px">✓ Pay ${fmt(settlement)} as final settlement.</div>`}</div><div style="display:flex;flex-direction:column;gap:12px"><div class="fg"><label>End Date (BS)</label><div class="date-row"><input id="lv-date" value="${today.str}"><button class="btn btn-s" onclick="showBSPicker('lv-date')">📅</button></div></div><div class="fg"><label>Reason</label><select id="lv-reason"><option value="left">Left (resigned)</option><option value="fired">Fired</option></select></div><div class="fg"><label>Settlement Paid (रू)</label><input id="lv-settlement" type="number" value="${Math.max(0,settlement)}"></div><div class="fg"><label>Note</label><input id="lv-note" placeholder="Handover notes…"></div><input type="hidden" id="lv-idx" value="${i}"></div><div class="modal-actions"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-d" onclick="confirmLeave()">Confirm & Settle</button></div>`;}
function confirmLeave(){const i=parseInt(document.getElementById('lv-idx').value);const endDate=document.getElementById('lv-date')?.value.trim();if(!isValidBSDate(endDate)){alert('Invalid date');return;}const reason=document.getElementById('lv-reason').value;const note=document.getElementById('lv-note')?.value.trim();const sp=parseFloat(document.getElementById('lv-settlement')?.value)||0;currentData.employees[i].endDate=endDate;currentData.employees[i].status=reason;currentData.employees[i].settlementPaid=sp;currentData.employees[i].settlementDate=endDate;if(note)currentData.employees[i].note=(currentData.employees[i].note||'')+' | '+note;closeModal();saveData();showToast(`✓ Settled`);render();}

function renderAdvances(calc){let sorted=[...currentData.advances].map((a,i)=>({...a,i})).sort((a,b)=>b.date.localeCompare(a.date));if(searchQuery){const q=searchQuery.toLowerCase();sorted=sorted.filter(a=>a.date.includes(q)||a.employee.toLowerCase().includes(q)||(a.note||'').toLowerCase().includes(q));}const total=currentData.advances.reduce((s,a)=>s+a.amount,0);return staffSubNav()+`<div class="card"><div class="card-hd"><h3>👤 By Employee</h3></div><div class="tbl-wrap"><table><thead><tr><th>Name</th><th class="tr">Advances</th><th class="tr">Annual Sal.</th><th class="tr">Adv%</th></tr></thead><tbody>${currentData.employees.map(e=>{const adv=Object.values(calc.employeeAdvances[e.name]||{}).reduce((s,v)=>s+v,0);const pct=e.salary*12>0?Math.round(adv/e.salary/12*100):0;return adv>0?`<tr><td class="bold">${e.name}</td><td class="tr td">${fmt(adv)}</td><td class="tr tm">${fmt(e.salary*12)}</td><td class="tr"><span class="tag ${pct>50?'tr-tag':pct>25?'tw':'tg'}">${pct}%</span></td></tr>`:''}).join('')}<tr class="tr-total"><td>Total</td><td class="tr td">${fmt(total)}</td><td></td><td></td></tr></tbody></table></div></div><div class="card"><div class="card-hd"><h3>📋 All Advance Records</h3><small>${currentData.advances.length} entries</small></div><div class="card-bd" style="padding-bottom:4px"><div class="search-box">🔍 <input placeholder="Search date or employee…" value="${searchQuery}" oninput="searchQuery=this.value;render()"></div></div>${sorted.length===0?`<div class="empty"><span class="eico">💼</span><p>${searchQuery?'No matching advances':'No advances yet'}</p></div>`:`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Employee</th><th class="tr">Amount</th><th>Note</th><th></th></tr></thead><tbody>${sorted.map(a=>{if(editIndex.advance===a.i)return`<tr><td><input class="ie" id="ea-date" value="${a.date}" style="width:88px"><button class="btn btn-s" onclick="showBSPicker('ea-date')" style="padding:4px 6px">📅</button></td><td><select class="ie" id="ea-emp">${currentData.employees.map(e=>`<option ${e.name===a.employee?'selected':''}>${e.name}</option>`).join('')}</select></td><td><input class="ie" id="ea-amt" type="number" value="${a.amount}" style="width:78px"></td><td><input class="ie" id="ea-note" value="${a.note||''}" style="width:88px"></td><td style="display:flex;gap:3px"><button class="btn btn-g btn-s" onclick="saveAdvEdit(${a.i})">✓</button><button class="btn btn-s" onclick="cancelAdvEdit()">✕</button></td></tr>`;return`<tr><td class="bold">${a.date}</td><td>${a.employee}</td><td class="tr td bold">${fmt(a.amount)}</td><td class="tm" style="font-size:11px">${a.note||'—'}</td><td style="display:flex;gap:3px"><button class="btn btn-s" onclick="startAdvEdit(${a.i})">✏️</button><button class="btn btn-d btn-s" onclick="deleteAdvance(${a.i})">✕</button></td></tr>`;}).join('')}<tr class="tr-total"><td colspan="2">Total</td><td class="tr td">${fmt(total)}</td><td colspan="2"></td></tr></tbody></table></div>`}</div>`;}

function cancelAdvEdit(){editIndex.advance=-1;render();}
function saveAdvEdit(i){const date=document.getElementById('ea-date')?.value;if(!isValidBSDate(date)){alert('Invalid date');return;}currentData.advances[i]={date,employee:document.getElementById('ea-emp')?.value,amount:parseFloat(document.getElementById('ea-amt')?.value)||0,note:document.getElementById('ea-note')?.value||''};editIndex.advance=-1;saveData();showToast('✓ Updated');render();}
